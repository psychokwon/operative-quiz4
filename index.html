<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operative Dentistry · Quiz 4 Prep</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#667;--bd:#d8dce6;--ac:#2f6fed;--ok:#1f9d55;--bad:#d64545;--sel:#e7efff}
.dark{--bg:#12151c;--card:#1c212b;--tx:#e6e9ef;--mu:#9aa3b2;--bd:#323a48;--ac:#6b9bff;--ok:#3ccf7e;--bad:#ff6b6b;--sel:#24324d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:1.05rem;margin:0}main{max-width:820px;margin:auto;padding:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}.opt.sel{background:var(--sel);border-color:var(--ac)}
.opt.ok{border-color:var(--ok);box-shadow:inset 4px 0 var(--ok)}.opt.bad{border-color:var(--bad);box-shadow:inset 4px 0 var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.nav button{width:38px;padding:6px 0}
.nav .ans{background:var(--sel)}.nav .cur{outline:2px solid var(--ac)}.nav .r{border-color:var(--ok);color:var(--ok)}.nav .w{border-color:var(--bad);color:var(--bad)}
.exp{border-left:4px solid var(--ac);padding:10px 12px;margin-top:12px;background:var(--bg);border-radius:6px}
.exp h4{margin:12px 0 4px;font-size:.92rem;color:var(--ac)}.exp h4:first-child{margin-top:0}.exp p{margin:4px 0}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;margin-right:6px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:.9rem}.ok{color:var(--ok)}.bad{color:var(--bad)}
.hint{font-size:.85rem;color:var(--mu);margin-top:4px}
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tabs button{border-radius:20px;padding:6px 14px}
</style></head><body>

<script>
const D={"q": {"1": {"id": 1, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which bonding-system component is hydrophobic, which is why isolation is key?", "o": ["Adhesive", "Primer", "Etchant", "None of the above"], "a": 0, "qk": "접착 시스템 성분 중 소수성(hydrophobic)이어서 격리가 중요한 이유가 되는 것은?", "ok": ["접착제(Adhesive)", "프라이머(Primer)", "산부식제(Etchant)", "위의 어느 것도 아니다"], "exp": "접착 시스템(Bonding Systems)은 세 성분으로 이루어집니다.\n\n1. **산부식제(Etchant)**: 강산(strong acids)으로 **도말층(smear layer)을 제거**하고 **콜라겐 기질을 탈회(demineralize)**하여 **미세기계적 유지(micro mechanical retention)**를 만듭니다.\n2. **프라이머(Primer)**: **콜라겐 기질이 무너지는 것(collapsing)을 막고**, **남은 수분을 제거**하여 접착제가 상아세관으로 흘러 들어가게 합니다.\n3. **접착제(Adhesive)**: **소수성(hydrophobic)**이며, 그래서 **격리가 핵심입니다(why isolation is key).** 접착제는 기질과 상아세관으로 흘러 들어가 **혼성층(hybrid layer)과 레진 태그(resin tags)**를 만듭니다.\n\n그림 순서도 기억해 두세요: 형성 후 상아질 → 산부식 후 상아질 → 탈회된 상아질 콜라겐 기질 → 접착제 적용 후 상아세관 속 레진 태그.", "why": {"0": "'Adhesive – are hydrophobic (why isolation is key)'입니다. 정답입니다.", "1": "프라이머는 콜라겐 기질이 무너지지 않게 하고 남은 수분을 제거하여 접착제가 상아세관으로 흘러 들어가게 합니다. 소수성이라는 설명은 접착제에 있습니다.", "2": "산부식제는 강산으로, 도말층을 제거하고 콜라겐 기질을 탈회시켜 미세기계적 유지를 만듭니다.", "3": "Adhesive가 보기에 있으므로 틀립니다."}, "one": "Etchant = 도말층 제거·탈회 / Primer = 콜라겐 붕괴 방지·수분 제거 / Adhesive = 소수성·혼성층·레진 태그.", "src": "Fillings - Composite, GI.pdf, p.20", "nota": true}, "2": {"id": 2, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "The internal wall of a conventional Class V cavity preparation is the:", "o": ["Gingival wall", "Occlusal wall", "Pulpal floor", "None of the above"], "a": 3, "qk": "전통적인 5급 와동의 내부 벽(internal wall)은 무엇인가?", "ok": ["치은측벽(Gingival wall)", "교합측벽(Occlusal wall)", "치수벽/치수저(Pulpal floor)", "위의 어느 것도 아니다"], "exp": "Class V는 평활면 우식(smooth surface caries)이고, 전통적인 와동 형성(conventional cavity preparation) 그림에는 다음 벽들이 나옵니다.\n\n- 외부 벽(external walls): **교합측벽(Occlusal wall)**, **치은측벽(Gingival wall)**, **근심벽(M)**, **원심벽(D)**\n- 내부 벽(internal wall): **축벽(Axial wall)**\n\n치수벽(pulpal floor)은 1급(Class I) 와동의 내부 벽 이름이니, 5급의 **축벽**과 헷갈리지 않도록 해야 합니다.\n\n보기에는 치수벽과 외부 벽인 교합측벽, 치은측벽만 있고 축벽이 없습니다. 그래서 '위의 어느 것도 아니다'가 정답입니다.", "why": {"0": "치은측벽은 Class V의 외부 벽(external wall) 중 하나입니다. 내부 벽이 아닙니다.", "1": "교합측벽도 Class V의 외부 벽 중 하나입니다. 치아 외면에 수직으로 형성하는 벽입니다.", "2": "치수벽은 1급(Class I)처럼 교합면 와동의 바닥(내부 벽)입니다. Class V의 내부 벽은 축벽(axial wall)입니다.", "3": "정답 보기들 중에 '축벽(axial wall)'이 없습니다. Class V의 내부 벽은 축벽이므로 '위의 어느 것도 아니다'가 정답입니다."}, "one": "Class V 내부 벽 = 축벽(axial wall). Pulpal floor는 Class I.", "src": "Cl V 2026.pdf, p.12", "nota": true}, "3": {"id": 3, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Phosphoric acid can be used as the conditioner for glass ionomer because it strengthens the chemical bond.", "o": ["True", "False"], "a": 1, "qk": "인산(phosphoric acid)은 화학 결합을 강하게 하므로 글래스아이오노머의 컨디셔너로 사용할 수 있다.", "ok": ["참(True)", "거짓(False)"], "exp": "글래스아이오노머(GI)의 임상 술식에서 가장 중요한 원칙은 다음 두 가지입니다.\n\n1. **반드시 Cavity Conditioner(etch), 즉 20% 폴리아크릴산(polyacrylic acid)을 사용**합니다.\n2. **인산(phosphoric acid)은 화학 결합을 약하게 하므로 GI와는 절대 같이 쓰지 않습니다(phosphoric acid weakens the chemical bond so never use with GI).**\n\n전자현미경 사진을 비교하면 차이가 분명합니다. 20% 폴리아크릴산으로 처리하면 도말층(smear layer)은 제거되지만 상아세관은 막힌 채로 남습니다(tubules remain plugged). 반면 인산으로 부식한 상아질은 모습이 다릅니다.\n\nGI는 치아의 Ca²⁺와 화학 반응(킬레이션, chelation)으로 붙는 재료입니다. 그 화학 결합을 약하게 만드는 인산은 쓰면 안 됩니다. 문제는 인산이 결합을 '강하게' 한다고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 GI에 인산을 써도 된다고 보는 것인데, 인산은 화학 결합을 약하게 하므로 GI에는 절대 쓰지 않고 20% 폴리아크릴산 컨디셔너를 씁니다."}, "one": "GI 컨디셔너 = 20% 폴리아크릴산, 인산은 절대 금지(화학 결합 약화).", "src": "Fillings - Composite, GI.pdf, p.34, 37", "nota": false}, "4": {"id": 4, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Zinc in amalgam acts as a scavenger for oxides.", "o": ["True", "False"], "a": 0, "qk": "아말감의 아연(zinc)은 산화물 제거제(scavenger for oxides) 역할을 한다.", "ok": ["참(True)", "거짓(False)"], "exp": "아말감 합금 가루의 성분은 양이 많은 순서대로 **은(Silver) > 주석(Tin) > 구리(Copper) > 아연(Zinc) > 인듐/팔라듐(Indium/Palladium)**이고, 여기에 수은(Mercury)을 섞습니다.\n\n**아연(Zinc)**의 역할은 다음과 같습니다.\n- **산화물 제거제(scavenger for oxides)**\n- **지연 팽창(delayed expansion)을 일으킵니다.** 이 효과를 줄이기 위해 아연이 없는 합금(zinc free alloys)도 있습니다.\n\n지연 팽창은 '아연이 들어 있는 아말감이 수분에 오염되었을 때' 생깁니다. 아연은 좋은 역할(산화물 제거)과 나쁜 역할(지연 팽창)을 함께 가진 성분입니다.", "why": {"1": "False를 고르면 아연의 역할을 부정하는 것인데, 'Scavenger for oxides'가 아연의 역할로 제시되어 있으므로 틀립니다."}, "one": "Zinc = 산화물 제거 + (수분 오염 시) 지연 팽창 → zinc-free 합금도 있음.", "src": "Fillings - Amalgam.pdf, p.10, 16, 30", "nota": false}, "5": {"id": 5, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Creep of amalgam is best described as:", "o": ["Discoloration from a chemical reaction between amalgam and oral fluid", "“Stretch” of thin margins beyond their limit: plastic deformation", "Loss of electrons (oxidation) causing material to go into solution", "None of the above"], "a": 1, "qk": "아말감의 크리프(creep)를 가장 잘 설명한 것은?", "ok": ["아말감과 구강액의 화학 반응에 의한 변색", "얇은 변연이 한계를 넘어 '늘어나는' 것: 소성 변형", "전자를 잃는 산화로 재료가 용액 속으로 녹아 나가는 것", "위의 어느 것도 아니다"], "exp": "아말감의 성질 다섯 가지 중 크리프, 변색, 부식은 정의를 서로 바꿔 내기 좋습니다.\n\n- **크리프(Creep)**: 얇은 변연이 한계를 넘어 '늘어나는(stretch)' 것, 즉 **소성 변형(plastic deformation)**. 씹을 때 아말감에 걸리는 힘이 커져서 생깁니다.\n- **변색(Tarnish)**: 아말감과 구강액의 화학 반응으로 치면 색이 변하는 것. 비심미적이지만 임상적 영향이 없고 실패 원인도 아닙니다.\n- **부식(Corrosion)**: 금속이 전자를 잃는 산화(oxidation)로 시작하여, 재료가 타액 속으로 녹아 나가 거칠어지거나 패이는 것. 음식이나 타액의 화학적 공격으로도 생깁니다.", "why": {"0": "이것은 변색(tarnish)입니다.", "1": "크리프의 정의 그대로입니다. 정답입니다.", "2": "이것은 부식(corrosion)입니다.", "3": "첫 번째 보기가 정답이므로 틀립니다."}, "one": "Creep = 소성 변형(얇은 변연 늘어남) / Tarnish = 변색 / Corrosion = 산화·용해.", "src": "Fillings - Amalgam.pdf, p.32, 35, 37", "nota": true}, "6": {"id": 6, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "In the sandwich technique, the bond between GIC and tooth is chemical, while the bond between composite and GIC is micromechanical.", "o": ["True", "False"], "a": 0, "qk": "샌드위치 기법에서 GIC와 치아 사이 결합은 화학적이고, composite와 GIC 사이 결합은 미세기계적(micromechanical)이다.", "ok": ["참(True)", "거짓(False)"], "exp": "샌드위치 기법에는 결합면이 세 종류 생깁니다. 각각의 결합 종류(types of bond)를 짝지어 기억하세요.\n\n- **GIC – 치아(Tooth)**: **화학적(chemical)** 결합입니다.\n- **Composite – 치아(Tooth)**: **미세기계적(micromechanical)** 결합입니다. 산부식과 접착제로 만든 미세한 요철과 레진 태그에 의해 붙습니다.\n- **Composite – GIC**: 역시 **미세기계적(micromechanical)** 결합입니다.\n\n즉, '화학적' 결합은 GIC와 치아 사이 하나뿐이고, composite가 관여하는 결합은 상대가 치아든 GIC든 미세기계적입니다. 문제의 문장은 이 내용과 일치하므로 참입니다.", "why": {"1": "False를 고르면 둘 중 하나의 결합 종류가 다르다고 보는 것인데, GIC–tooth는 chemical, composite–GIC는 micromechanical로 문장 그대로가 맞으므로 틀립니다."}, "one": "GIC–치아 = 화학적, composite–치아/composite–GIC = 미세기계적.", "src": "Cl V 2026.pdf, p.48", "nota": false}, "7": {"id": 7, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In the minimal preparation of a non-carious Class V lesion, the dentin is roughened with:", "o": ["Pumice", "Spoon excavator", "#330 diamond", "#201.3 diamond"], "a": 2, "qk": "비우식성 5급 병소의 최소 형성에서 상아질을 거칠게 하는 데 쓰는 것은?", "ok": ["퍼미스(Pumice)", "스푼 엑스카베이터(Spoon excavator)", "#330 diamond", "#201.3 diamond"], "exp": "비우식성 병소(non-carious lesion)는 세균에 감염된 조직이 없으므로, 깎아낼 것이 거의 없습니다. 그래서 **최소 형성(minimal preparation)**만 합니다. 단계는 다음과 같습니다.\n\n1. **퍼미스로 부위 세척**(clean area with pumice)\n2. **#330 diamond로 상아질을 거칠게**(roughen dentin)\n3. **#201.3 diamond로 법랑질 베벨**(bevel enamel)\n4. 병소가 크면 **치은측 홈(gingival groove)** 추가\n\n반면 우식성 병소(carious lesion)는 round bur와 spoon excavator로 병소를 제거하고, 지지되지 않은 법랑질을 없앤 뒤, #201.3 diamond로 법랑질 베벨을 줍니다. 두 경우의 단계 차이를 비교해서 기억하세요.", "why": {"0": "퍼미스는 최소 형성의 첫 단계에서 부위를 깨끗이 하는 용도(clean area with pumice)입니다.", "1": "스푼 엑스카베이터는 우식성 병소에서 병소를 제거할 때 round bur와 함께 씁니다. 비우식성 병소에는 제거할 우식이 없습니다.", "2": "'Roughen dentin with #330 diamond'입니다. 정답입니다.", "3": "#201.3 diamond는 법랑질에 베벨을 주는 용도(bevel enamel)입니다. 상아질을 거칠게 하는 용도가 아닙니다."}, "one": "NCCL 최소 형성: 퍼미스 세척 → #330로 상아질 거칠게 → #201.3로 베벨 → 크면 gingival groove.", "src": "Cl V 2026.pdf, p.16, 17", "nota": false}, "8": {"id": 8, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "In a carious Class V lesion prepared for composite, the enamel is beveled with a #245 bur.", "o": ["True", "False"], "a": 1, "qk": "우식성 5급 병소를 composite용으로 형성할 때 법랑질 베벨(bevel)은 #245 bur로 만든다.", "ok": ["참(True)", "거짓(False)"], "exp": "Class V에서 쓰는 bur 번호들은 서로 헷갈리게 출제되기 좋습니다. 하나씩 용도를 정리해 봅시다.\n\n- **#2 round bur (1 mm)**: 처음 들어가는 길을 만드는 초기 접근(initial access)용입니다.\n- **#245, #330 (pear-shaped bur)**: 와동 형태를 만드는 형성(prep)용입니다.\n- **#201.3 diamond**: 법랑질 베벨(bevel enamel)용입니다. 우식성 병소든 비우식성 병소든 composite를 위해 법랑질에 베벨을 줄 때 이 bur를 씁니다. 크기는 끝지름(minor diameter) 0.3 mm, 큰 지름(major diameter) 0.8 mm, 길이 3 mm입니다.\n- **#330 diamond**: 비우식성 병소에서 상아질 표면을 거칠게(roughen dentin) 하는 용도입니다.\n\n우식성 병소(carious lesion)의 형성 순서는 round bur와 spoon excavator로 병소 제거 → 지지되지 않은 법랑질 제거 → **#201.3 diamond로 법랑질 베벨**입니다. 베벨은 0.5 mm 폭, 45도로 줍니다. 따라서 '#245로 베벨'은 거짓입니다. #245는 형성용 pear-shaped bur입니다.", "why": {"0": "True를 고르면 #245로 베벨을 준다고 보는 것인데, #245는 와동 형성용 pear-shaped bur이고 베벨은 #201.3 diamond로 주므로 틀립니다."}, "one": "법랑질 베벨 = #201.3 diamond (0.5 mm, 45°). #245/#330 = 형성, #2 round = 초기 접근.", "src": "Cl V 2026.pdf, p.15, 17, 29, 30", "nota": false}, "9": {"id": 9, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Prime & Bond (Dentsply) and Single Bond (3M) are examples of which bonding generation?", "o": ["5th generation – two-step etch & rinse", "7th generation – one-step self-etching", "6th generation – two-step self-etching", "4th generation – three-step etch & rinse"], "a": 0, "qk": "Prime & Bond(Dentsply)와 Single Bond(3M)는 몇 세대 접착 시스템의 예인가?", "ok": ["5세대 – 2단계 etch & rinse", "7세대 – 1단계 자가부식", "6세대 – 2단계 자가부식", "4세대 – 3단계 etch & rinse"], "exp": "접착 시스템 세대와 제품 예를 표로 정리하면 다음과 같습니다.\n\n- **4세대 – 3단계 Etch & Rinse** (gold standard, 가장 믿을 만함): 37% 인산 15–20초 산부식·세척 → primer 15초·건조 → adhesive·광중합 / 예: Scotchbond Multi Purpose(3M), All Bond 3(Bisco), Optibond FL(Kerr)\n- **5세대 – 2단계 Etch & Rinse** (primer와 adhesive를 하나로): 37% 인산 15–20초 산부식·세척 → primer-adhesive·중합 / 예: **Prime & Bond(Dentsply), Single Bond(3M)**\n- **6세대 – 2단계 Self-Etching**: 자가부식 primer → adhesive·중합 / 예: Clearfil SE(Kuraray), All Bond SE(Bisco)\n- **7세대 – 1단계 Self-Etching** (conditioner, primer, adhesive 올인원) / 예: Clearfil S3 Bond(Kuraray)\n- **'8세대'** – Universal (total, selective, self etch) / 예: Scotchbond Universal(3M)\n\n'Single Bond'와 'Scotchbond Universal'은 둘 다 3M 제품이라 헷갈리기 쉽습니다. Single Bond는 5세대, Scotchbond Universal은 '8세대'입니다.", "why": {"0": "5세대의 예가 Prime & Bond와 Single Bond입니다. 정답입니다.", "1": "7세대의 예는 Clearfil S3 Bond(Kuraray)입니다.", "2": "6세대의 예는 Clearfil SE(Kuraray), All Bond SE(Bisco)입니다.", "3": "4세대의 예는 Scotchbond Multi Purpose(3M), All Bond 3(Bisco), Optibond FL(Kerr)입니다."}, "one": "Prime & Bond, Single Bond = 5세대(2단계 etch & rinse).", "src": "Fillings - Composite, GI.pdf, p.21, 22, 23, 24, 25, 26", "nota": false}, "10": {"id": 10, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "In amalgam alloy powder, which is the SECOND largest component?", "o": ["Zinc", "Tin", "Indium/Palladium", "Copper"], "a": 1, "qk": "아말감 합금 가루에서 두 번째로 많은 성분은?", "ok": ["아연(Zinc)", "주석(Tin)", "인듐/팔라듐(Indium/Palladium)", "구리(Copper)"], "exp": "아말감은 **합금 가루(Alloy Powder)**와 **수은(Mercury)**으로 이루어집니다. 합금 가루의 성분을 많은 순서대로 쓰면 다음과 같습니다.\n\n**은(Silver, 가장 많음) > 주석(Tin) > 구리(Copper) > 아연(Zinc) > 인듐/팔라듐(Indium/Palladium, 가장 적음)**\n\n각 성분의 핵심 역할도 함께 정리하세요.\n- 은: 강도, 흐름·크리프 감소, 경화 팽창 증가\n- 주석: 팽창 감소, 강도 감소, 흐름 증가, 반응 속도 조절, 수은과 잘 결합하여 γ2 형성\n- 구리: 경도·강도 증가\n- 아연: 산화물 제거, 지연 팽창\n- 인듐/팔라듐: 부식 감소", "why": {"0": "아연은 네 번째입니다.", "1": "주석은 두 번째로 많은 성분(2nd largest component)입니다. 정답입니다.", "2": "인듐/팔라듐은 가장 적은 성분(smallest component)입니다.", "3": "구리는 세 번째입니다."}, "one": "합금 가루 순서: Ag > Sn > Cu > Zn > In/Pd.", "src": "Fillings - Amalgam.pdf, p.10, 11, 12, 13, 16, 17", "nota": false}, "11": {"id": 11, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "When selecting a shade for a Class V composite, gingival colors tend to be darker.", "o": ["True", "False"], "a": 0, "qk": "5급 composite의 색조를 고를 때, 치은 쪽(gingival) 색은 더 어두운 경향이 있다.", "ok": ["참(True)", "거짓(False)"], "exp": "치아 한 개 안에서도 부위마다 색이 다릅니다. 치경부, 즉 잇몸에 가까운 **치은측(gingival) 부위의 색은 더 어두운 경향(gingival colors tend to be darker)**이 있습니다. Class V는 바로 이 치경부를 수복하므로, 치아 중앙이나 절단 쪽 색만 보고 shade를 고르면 수복물이 주변보다 밝아 보일 수 있습니다.\n\nShade selection에서 함께 기억할 원칙은 세 가지입니다.\n1. 격리 전에 고른다(치아는 마르면 밝아짐).\n2. 가능하면 제조사의 shade guide를 사용한다.\n3. 치은 쪽 색은 더 어둡다.", "why": {"1": "False를 고르면 치은 쪽 색이 어둡지 않다는 뜻이 되는데, 'Gingival colors tend to be darker'가 shade selection의 기준이므로 틀립니다."}, "one": "치경부(gingival) 색은 더 어둡다 → Class V shade 선택 시 고려.", "src": "Cl V 2026.pdf, p.32", "nota": false}, "12": {"id": 12, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Which statement about incremental condensation of amalgam is correct?", "o": ["A new mix should be added before the old mix loses its plasticity", "The mercury-rich surface of the last increment should be left in place", "Each increment should be condensed only after its surface turns dull", "None of the above"], "a": 0, "qk": "아말감을 조금씩 응축하는 방법에 대한 설명으로 옳은 것은?", "ok": ["새 혼합물은 이전 혼합물이 가소성을 잃기 전에 추가해야 한다", "수은이 풍부한 마지막 층의 표면은 그대로 남겨 둔다", "각 층은 표면이 광택을 잃은 뒤에 응축해야 한다", "위의 어느 것도 아니다"], "exp": "아말감 충전의 원칙 네 가지를 다시 확인합시다.\n\n1. **표면이 아직 반짝일 때 조금씩 응축합니다.**\n2. 반짝인다는 것은 층끼리 붙을 만큼 수은이 충분하다는 뜻입니다.\n3. **수은이 풍부한 마지막 층의 표면은 조각하여 제거합니다.**\n4. **새 혼합물은 이전 혼합물이 가소성을 잃기 전에 추가합니다.**\n\n오답 보기들은 1번과 3번을 정반대로 바꾼 것입니다. 응축은 수은을 짜내고 합금을 치밀하게 만들기 위해 좋은 압력으로 해야 하며, 응축이 나쁘면 기포(voids)가 생길 수 있습니다.", "why": {"0": "'New mix should be added before the old mix loses its plasticity'입니다. 정답입니다.", "1": "수은이 풍부한 마지막 층의 표면은 조각하여 제거해야 합니다(should be carved away).", "2": "아말감은 표면이 아직 '반짝일 때' 응축합니다. 반짝임은 층끼리 붙을 만큼 수은이 충분하다는 뜻입니다.", "3": "첫 번째 보기가 정답이므로 틀립니다."}, "one": "아말감 응축: 반짝일 때, 가소성 잃기 전에 새 혼합물 추가, 수은 많은 마지막 표면은 조각해 제거.", "src": "Fillings - Amalgam.pdf, p.28, 38", "nota": true}, "13": {"id": 13, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "If a Class V cavity is located in the root, the axial wall depth is 1.25–1.50 mm.", "o": ["True", "False"], "a": 1, "qk": "5급 와동이 치근(root)에 있을 경우 축벽 깊이는 1.25–1.50 mm이다.", "ok": ["참(True)", "거짓(False)"], "exp": "Class V 축벽 깊이는 위치에 따라 세 가지 수치로 나뉩니다. 서로 바꿔 내기 좋은 숫자이니 정확히 구분하세요.\n\n- **교합측벽 쪽(at the occlusal wall)**: 1.25–1.50 mm\n- **치은측벽 쪽(at the gingival wall)**: 1–1.25 mm\n- **와동이 치근에 있을 때(cavity in the root)**: **0.75 mm**\n\n그리고 공통 원칙으로 상아질 안으로는 0.5 mm 들어가야 합니다(0.5 mm in dentin). 축벽은 치아 외형을 따라야 하며 평평하면 안 됩니다.\n\nbur 그림의 단면에서도 법랑질(enamel) 쪽 깊이는 1 mm, 백악질(cementum) 쪽 깊이는 0.75 mm로 표시되어 있습니다.\n\n문제의 1.25–1.50 mm는 교합측벽 쪽 깊이이므로 거짓입니다.", "why": {"0": "True를 고르면 치근 와동에도 1.25–1.50 mm를 적용하는 것인데, 이 수치는 교합측벽 쪽 깊이이고 치근 와동은 0.75 mm이므로 틀립니다."}, "one": "축벽 깊이: 교합측 1.25–1.50 / 치은측 1–1.25 / 치근 0.75 mm, 상아질 내 0.5 mm.", "src": "Cl V 2026.pdf, p.13, 14, 15", "nota": false}, "14": {"id": 14, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "According to the Class V lecture, amalgam is indicated for a Class V restoration:", "o": ["When there is no remaining enamel at the gingival margin and a tooth-colored restoration is desired", "When the lesion is within the anatomical crown and surrounded by enamel", "Where isolation/moisture control is challenging, such as lingual root caries", "None of the above"], "a": 2, "qk": "5급 강의에서 아말감이 5급 수복에 적응증이 되는 경우는?", "ok": ["치은측 변연에 법랑질이 없고 치아색 수복을 원할 때", "병소가 해부학적 치관 안에 있고 법랑질로 둘러싸여 있을 때", "격리·방습이 어려운 곳, 예를 들어 설측 치근 우식", "위의 어느 것도 아니다"], "exp": "Class V 수복 재료(The Restorative Materials)는 Composite, Amalgam, RMGIC/GIC, Gold입니다. 어떤 재료를 쓸지는 병소의 위치와 조건으로 정합니다.\n\n- 해부학적 치관 안(법랑질로 둘러싸임) → **Composite**\n- 치관과 치근에 걸쳐 치은측에 법랑질 없음 → **Sandwich technique (RMGI + Composite)**\n- 치근 안(치근 우식) → **RMGIC**\n- **격리/방습이 어려운 곳, 설측 치근 우식 → Amalgam**(기계적 유지 형태와 함께)\n\n아말감은 수분 조절이 어려운 곳에서 쓰는 재료로 제시됩니다. 그리고 아말감은 유지구(retention groove) 같은 기계적 유지 형태와 함께 써야 합니다(Use Amalgam with Mechanical Retentive Features).", "why": {"0": "이 경우는 RMGI를 먼저 넣고 composite로 덮는 샌드위치 기법(sandwich technique)을 씁니다.", "1": "병소가 해부학적 치관 안(법랑질)에 있으면 composite를 씁니다.", "2": "아말감 Class V의 적응증은 '격리/방습이 어려운 곳'과 '설측 치근 우식'입니다. 정답입니다.", "3": "첫 번째 보기가 아말감의 적응증이므로 틀립니다."}, "one": "Class V 아말감 적응증 = 방습 어려움 + 설측 치근 우식, 유지구 필수.", "src": "Cl V 2026.pdf, p.25, 27, 47, 49, 61, 62", "nota": true}, "15": {"id": 15, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "According to the ADA, the compressive strength of amalgam must reach:", "o": ["275–300 MPa within 30 minutes", "80 MPa within 24 hours", "400–500 MPa within 1 hour", "80 MPa within 1 hour"], "a": 3, "qk": "ADA 기준에 따르면 아말감의 압축 강도는 어느 수준에 도달해야 하는가?", "ok": ["30분 안에 275–300 MPa", "24시간 안에 80 MPa", "1시간 안에 400–500 MPa", "1시간 안에 80 MPa"], "exp": "아말감 강도(Strength)에 관한 숫자를 정리합니다.\n\n- **ADA 기준: 1시간 안에 압축 강도 80 MPa**\n- 완전히 경화된 뒤: 보통 **400–500 MPa**\n- 표의 시간별 압축 강도: 30분 67–111 MPa, 1시간 109–188 MPa, 1일 402–451 MPa\n- 인장 강도: 아말감 50–54 MPa, 법랑질 10 MPa, 상아질 50–105 MPa\n- 상아질 압축 강도: 275–300 MPa\n\n오답 보기는 숫자나 시간을 다른 항목과 바꿔 놓은 것입니다. 'ADA = 80 MPa = 1시간'을 한 묶음으로 외우세요. 그리고 연마는 24시간 후입니다.", "why": {"0": "275–300 MPa는 표에서 상아질(dentin)의 압축 강도 값입니다. ADA 기준이 아닙니다.", "1": "수치는 맞지만 시간이 틀렸습니다. 24시간은 연마를 할 수 있는 시점입니다.", "2": "400–500 MPa는 완전히 경화된 뒤 보통 도달하는 압축 강도입니다. 1시간 안의 ADA 기준이 아닙니다.", "3": "'Compressive strength must reach 80 MPa within 1 hour according to ADA'입니다. 정답입니다."}, "one": "ADA: 1시간 안에 압축 강도 80 MPa, 완전 경화 시 400–500 MPa.", "src": "Fillings - Amalgam.pdf, p.25, 39", "nota": false}, "16": {"id": 16, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "Which statement about cervical lesions is correct?", "o": ["Abfraction is loss of tooth structure from chemical dissolution caused by acidic food and drinks", "Erosion is loss of tooth structure from mechanical forces such as horizontal toothbrushing", "Failure to treat NCCLs can lead to tooth loss and the occurrence of additional lesions", "None of the above"], "a": 2, "qk": "치경부 병소에 대한 설명으로 옳은 것은?", "ok": ["Abfraction은 산성 음식·음료로 인한 화학적 용해에 의한 치질 소실이다", "침식(Erosion)은 수평 칫솔질 같은 기계적 힘에 의한 치질 소실이다", "NCCL을 치료하지 않으면 치아 상실과 추가 병소 발생으로 이어질 수 있다", "위의 어느 것도 아니다"], "exp": "이 문제는 NCCL의 정의와 방치했을 때의 결과를 함께 묻고 있습니다.\n\n먼저 정의입니다. Erosion은 산성 음식·음료에 의한 **화학적 용해**, Abrasion은 수평 칫솔질 같은 **기계적 힘**, Abfraction은 **하중 관련 응력**에 의한 치경부 마모입니다. 두 개의 오답 보기는 이 정의를 서로 바꿔 놓은 것입니다.\n\n다음은 결과입니다. NCCL을 예방·치료하지 않으면 치질의 진행성 소실, 치아 과민, 근관치료의 필요, **치아 상실**, **추가 병소 발생**이 생깁니다. 그래서 첫 번째 보기가 옳습니다.", "why": {"0": "화학적 용해는 Erosion입니다. Abfraction은 하중 관련 기계적 응력에 의한 치경부 마모입니다.", "1": "기계적 힘(칫솔질)은 Abrasion입니다. Erosion은 산에 의한 화학적 용해입니다.", "2": "NCCL을 예방·치료하지 않은 결과 목록에 치아 상실(tooth loss)과 추가 병소 발생(occurrence of additional lesions)이 모두 있습니다. 정답입니다.", "3": "첫 번째 보기가 옳은 설명이므로 '위의 어느 것도 아니다'는 틀립니다."}, "one": "NCCL 방치 결과에는 치아 상실·추가 병소까지 포함된다.", "src": "Cl V 2026.pdf, p.5, 9", "nota": true}, "17": {"id": 17, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which statement about the LLUSD clinical procedure for composite is correct?", "o": ["Consepsis is applied for 20 seconds", "The bonding agent is scrubbed in for 10 seconds", "The bonding agent is light polymerized for 20 seconds", "None of the above"], "a": 3, "qk": "LLUSD composite 임상 술식에 대한 설명으로 옳은 것은?", "ok": ["Consepsis를 20초 도포한다", "접착제를 10초 문질러 바른다", "접착제를 20초 광중합한다", "위의 어느 것도 아니다"], "exp": "LLUSD 임상 술식(LLUSD Clinical Procedure)은 다음 9단계입니다.\n\n1. 격리(Rubber Dam, Clamp)\n2. 산부식(37% 인산, 15–20초)\n3. 세척·건조\n4. **Consepsis 60초 도포 후 건조**\n5. **접착제를 20초 문질러 바름(scrub in for 20 seconds)**\n6. 공기로 얇게 펴기(air thin)\n7. **10초 광중합**\n8. Composite를 조금씩 넣으며 중합\n9. 수복물 마무리\n\n세 오답 보기는 60, 20, 10이라는 숫자를 서로 바꿔 놓은 것입니다. 그래서 옳은 보기가 없고 정답은 '위의 어느 것도 아니다'입니다. 'Consepsis 60 → 접착제 20 → 광중합 10'으로 숫자가 점점 줄어든다고 기억하면 편합니다.", "why": {"0": "Consepsis는 60초 도포합니다. 20초는 접착제를 문질러 바르는 시간입니다.", "1": "접착제는 20초 문질러 바릅니다(scrub in for 20 seconds). 10초는 광중합 시간입니다.", "2": "접착제의 광중합은 10초입니다.", "3": "나머지 세 보기가 모두 시간이 틀렸으므로 '위의 어느 것도 아니다'가 정답입니다. 실제로는 Consepsis 60초, 접착제 20초 문지르기, 광중합 10초입니다."}, "one": "LLUSD: 인산 15–20초 → Consepsis 60초 → 접착제 20초 scrub → air thin → 광중합 10초.", "src": "Fillings - Composite, GI.pdf, p.27", "nota": true}, "18": {"id": 18, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Barium, strontium, and zirconia are fillers that cause radiopacity in composite.", "o": ["True", "False"], "a": 0, "qk": "바륨(barium), 스트론튬(strontium), 지르코니아(zirconia)는 composite에 방사선 불투과성(radiopacity)을 주는 필러이다.", "ok": ["참(True)", "거짓(False)"], "exp": "Composite 필러(Filler)의 종류에는 석영(quartz), 리튬 알루미늄 실리케이트(lithium aluminum silicate), 아연(zinc), 이터븀 플루오라이드(ytterbium fluoride), 바륨(barium), 스트론튬(strontium), 지르코니아(zirconia), 분쇄한 레진 composite(ground resin composites), 나노 크기 필러가 있습니다.\n\n이 중 **방사선 불투과성(radiopacity)을 만드는 것**은 **바륨, 스트론튬, 아연, 이터븀 플루오라이드, 지르코니아**입니다. 그래서 문제의 세 가지는 모두 방사선 불투과성을 주는 필러에 해당합니다.\n\n필러에 대해 함께 기억할 것은 다음과 같습니다. 필러는 composite의 30–70%를 차지합니다. 필러가 작을수록 심미성과 연마성이 좋아지고, 필러가 클수록 마모가 더 생길 수 있습니다.", "why": {"1": "False를 고르면 이 필러들이 방사선 불투과성과 무관하다는 뜻인데, 바륨·스트론튬·지르코니아는 모두 'Cause Radiopacity' 목록에 있으므로 틀립니다."}, "one": "방사선 불투과성 필러 = Ba, Sr, Zn, Yb fluoride, Zirconia.", "src": "Fillings - Composite, GI.pdf, p.10", "nota": false}, "19": {"id": 19, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Undertrituration decreases the strength of amalgam, whereas overtrituration increases it.", "o": ["True", "False"], "a": 1, "qk": "혼합 부족(undertrituration)은 아말감 강도를 낮추지만, 과다 혼합(overtrituration)은 강도를 높인다.", "ok": ["참(True)", "거짓(False)"], "exp": "강도에 영향을 주는 요인(Factors Affecting Strength)은 혼합(Trituration), 수은 함량(Mercury Content), 응축(Condensation)입니다.\n\n**혼합(Trituration)**\n- 아말감 합금의 종류에 따라 달라집니다.\n- 혼합 시간과 속도의 영향을 받습니다.\n- **혼합 부족(undertrituration)과 과다 혼합(overtrituration) 모두 강도를 낮춥니다.**\n\n즉, 너무 적게 섞어도, 너무 많이 섞어도 강도가 떨어집니다. 문제는 과다 혼합이 강도를 '높인다'고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 과다 혼합이 강도를 높인다고 보는 것인데, under-와 over-trituration 모두 강도를 낮춥니다."}, "one": "Under·Over-trituration 둘 다 강도↓.", "src": "Fillings - Amalgam.pdf, p.26", "nota": false}, "20": {"id": 20, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which of the following is a contraindication for glass ionomer?", "o": ["Block out", "Load-bearing restorations", "Sandwich technique in Class II", "Class V restorations"], "a": 1, "qk": "다음 중 글래스아이오노머의 금기증(contra-indication)은?", "ok": ["블록아웃(Block out)", "하중을 받는 수복(Load bearing restorations)", "2급의 샌드위치 기법", "5급 수복"], "exp": "**글래스아이오노머(Glass Ionomer)**의 적용과 금기증은 다음과 같습니다.\n\n**적용(Applications)**\n- Class III & Class V\n- Class II의 샌드위치 기법(sandwich technique)\n- 블록아웃(block out)\n\n**금기증(Contra-indications)**\n- 심미 수복(esthetic restorations)\n- **하중을 받는 수복(load bearing restorations)**\n\n오답 보기 세 개는 모두 '적용'에 있는 항목입니다. Class V 강의에서 치근 우식에 RMGIC를 쓰고, 샌드위치 기법에서 RMGI를 기저로 쓴 것도 이 적용과 연결됩니다.", "why": {"0": "블록아웃은 GI의 적용입니다.", "1": "GI의 금기증입니다. 정답입니다.", "2": "2급의 샌드위치 기법은 GI의 적용입니다.", "3": "Class III과 Class V는 GI의 적용(Applications)입니다."}, "one": "GI 적용 = Class III·V, Class II sandwich, block out / 금기 = 심미, 하중 부위.", "src": "Fillings - Composite, GI.pdf, p.35 / Cl V 2026.pdf, p.47, 49", "nota": false}, "21": {"id": 21, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "Loss of cervical tooth structure caused by horizontal toothbrushing is classified as:", "o": ["Abfraction", "Erosion", "Abrasion", "None of the above"], "a": 2, "qk": "수평 칫솔질(horizontal toothbrushing)로 인한 치경부 치질 소실은 무엇으로 분류되는가?", "ok": ["굴곡파절성 병소(Abfraction)", "침식(Erosion)", "마모(Abrasion)", "위의 어느 것도 아니다"], "exp": "NCCL 세 종류는 '무엇이 치질을 없앴는가'로 구분합니다.\n\n- **Erosion(침식)**: 산 → 화학적 용해(chemical dissolution)\n- **Abrasion(마모)**: 바깥의 기계적 힘(mechanical forces) → 대표적으로 **수평 칫솔질(horizontal toothbrushing)**\n- **Abfraction**: 하중(loading)과 관련된 기계적 응력(mechanical stress)\n\n가장 헷갈리는 짝은 Abrasion과 Abfraction입니다. 둘 다 mechanical이라는 단어가 들어가기 때문입니다. 하지만 칫솔처럼 **바깥에서 문지르는 힘**이면 Abrasion이고, 씹을 때 치아가 받는 **하중에서 오는 응력**이면 Abfraction입니다. 문제는 칫솔질이므로 Abrasion입니다.", "why": {"0": "Abfraction도 '기계적'이지만, 칫솔질이 아니라 하중(loading)과 관련된 응력(stress)에 의한 치경부 마모입니다.", "1": "침식은 산성 음식·음료에 의한 화학적 용해(chemical dissolution)입니다. 칫솔질 같은 기계적 원인이 아닙니다.", "2": "기계적 힘, 대표적으로 수평 칫솔질에 의한 치질 소실입니다. 정답입니다.", "3": "Abrasion이 정답으로 보기 안에 있으므로 '위의 어느 것도 아니다'는 틀립니다."}, "one": "칫솔질 = Abrasion, 하중 응력 = Abfraction, 산 = Erosion.", "src": "Cl V 2026.pdf, p.5", "nota": true}, "22": {"id": 22, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Which type of amalgam is the most commonly used today?", "o": ["Admixed amalgam", "Spherical amalgam", "Irregular amalgam", "None of the above"], "a": 0, "qk": "오늘날 가장 흔히 쓰이는 아말감의 종류는?", "ok": ["혼합형 아말감(Admixed amalgam)", "구형 아말감(Spherical amalgam)", "불규칙형 아말감(Irregular amalgam)", "위의 어느 것도 아니다"], "exp": "아말감의 종류(Types of Amalgam)는 합금 입자의 모양에 따라 세 가지입니다.\n\n1. **불규칙형(Irregular)**\n2. **구형(Spherical)**\n3. **혼합형(Admixed)**: **오늘날 가장 흔히 쓰이는 것(most commonly used today)**\n\n그림에서도 Irregular, Spherical, Admixed 세 가지 입자 모양을 나란히 비교합니다.", "why": {"0": "'Admixed Amalgam – What is most commonly used today'입니다. 정답입니다.", "1": "아말감의 세 종류 중 하나이지만 가장 흔히 쓰이는 것은 아닙니다.", "2": "아말감의 세 종류 중 하나이지만 가장 흔히 쓰이는 것은 아닙니다.", "3": "Admixed가 보기에 있으므로 틀립니다."}, "one": "오늘날 가장 흔한 아말감 = Admixed.", "src": "Fillings - Amalgam.pdf, p.19", "nota": true}, "23": {"id": 23, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Chemically activated (self-cure) composites are used more frequently for fillings than for core build-ups.", "o": ["True", "False"], "a": 1, "qk": "화학 중합형(self-cure) composite는 코어 축조(core build-up)보다 충전(filling)에 더 자주 쓰인다.", "ok": ["참(True)", "거짓(False)"], "exp": "Composite의 중합(polymerization, curing) 방식은 두 가지입니다. 화학 중합형(Chemically Activated, Self-Cure)과 광중합형(Photochemically Activated, Light-Cure)입니다. 어느 쪽이든 **활성제(activator)**와 **개시제(initiator)** 두 가지가 필요합니다.\n\n**화학 중합형(self-cure)**은 두 개의 페이스트로 공급됩니다.\n- 한쪽에는 **3차 아민(tertiary amine, N,N-dimethyl-p-toluidine)** 활성제가 들어 있습니다.\n- 다른 쪽에는 **벤조일 퍼옥사이드(benzoyl peroxide)** 개시제가 들어 있습니다.\n- 아민이 벤조일 퍼옥사이드와 반응하여 자유 라디칼(free radicals)을 만들고, 이것이 경화를 시작합니다.\n\n그리고 **섞어야 하기 때문에 충전에는 자주 쓰이지 않고(not used as frequently for fillings), 코어 축조에 더 자주 쓰입니다(more frequently used for core build-ups).** 문제는 이것을 반대로 썼으므로 거짓입니다.", "why": {"0": "True를 고르면 self-cure가 충전에 더 많이 쓰인다고 보는 것인데, 실제로는 섞어야 해서 충전에는 덜 쓰이고 코어 축조에 더 자주 쓰입니다."}, "one": "Self-cure = 두 페이스트(아민 + 벤조일 퍼옥사이드), 섞어야 해서 core build-up에 주로.", "src": "Fillings - Composite, GI.pdf, p.14, 15", "nota": false}, "24": {"id": 24, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In a conventional Class V preparation, the axial wall depth at the gingival wall is:", "o": ["1–1.25 mm", "0.25 mm", "0.75 mm", "1.25–1.50 mm"], "a": 0, "qk": "전통적인 5급 와동에서 치은측벽(gingival wall) 쪽 축벽 깊이는?", "ok": ["1–1.25 mm", "0.25 mm", "0.75 mm", "1.25–1.50 mm"], "exp": "Class V 축벽 깊이 숫자는 세트로 외워야 합니다.\n\n- 교합측벽(occlusal wall) 쪽: **1.25–1.50 mm**\n- 치은측벽(gingival wall) 쪽: **1–1.25 mm**\n- 와동이 치근(root)에 있으면: **0.75 mm**\n- 공통: 상아질 안으로 **0.5 mm**, 치아 외형을 따라 볼록하게(not flat)\n\n함정 보기들은 모두 이 강의에 실제로 나오는 다른 숫자들입니다. 숫자 자체는 낯익기 때문에 '어느 위치의 숫자인가'까지 짝지어 기억해야 맞힐 수 있습니다.", "why": {"0": "치은측벽 쪽 축벽 깊이 수치 그대로입니다. 정답입니다.", "1": "Class V 축벽 깊이 수치에 없는 값입니다. 1/4 mm는 아말감 Class V 유지구(retention groove)의 깊이입니다.", "2": "이것은 와동이 치근(root)에 있을 때의 축벽 깊이입니다.", "3": "이것은 교합측벽(occlusal wall) 쪽 깊이입니다. 치은측보다 교합측이 더 깊습니다."}, "one": "축벽 깊이: 교합측 1.25–1.50 > 치은측 1–1.25 > 치근 0.75 mm.", "src": "Cl V 2026.pdf, p.13, 14, 66", "nota": false}, "25": {"id": 25, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "LuxaCore core build-up requires at least how much natural tooth ferrule around the tooth?", "o": ["4–5 mm", "0.5 mm", "2 mm", "1 mm"], "a": 2, "qk": "LuxaCore 코어 축조에는 치아 주위에 최소 얼마의 자연치 ferrule이 필요한가?", "ok": ["4–5 mm", "0.5 mm", "2 mm", "1 mm"], "exp": "**LuxaCore**는 이중중합형(dual polymerized) 코어 축조 재료입니다. A3 shade와 Blue로 나오고, 카트리지 시스템으로 공급됩니다.\n\n**조성**: 아크릴 레진, 유리 분말, 실리카, UDMA\n**장점**: 방사선 불투과성, 불소 방출, 이중중합이라 한 번에 많이 넣어도(bulk filling) 완전히 굳음\n**적응증**: 완전한 격리가 가능한 경우의 코어 축조, 언더컷 차단(block-out), **치아 주위에 최소 2 mm의 자연치 ferrule 필요**\n**금기증**: 최종 수복 재료로 쓰지 않음(충전용 아님), 유지면의 50% 이상이 LuxaCore가 되는 고응력 상황에는 쓰지 않음\n\n임상 술식의 숫자도 함께 기억해 두세요. 산부식 15초, 접착제 20초, 광중합 10초, LuxaCore 주입 후 교합면에서 60초, matrix 제거 후 협·설측 각 30초 광중합(화학 중합은 5분)입니다. 격리가 안 되면 amalgam을 씁니다.", "why": {"0": "4–5 mm는 bulk-fill composite를 한 번에 넣을 수 있는 두께입니다. ferrule 기준이 아닙니다.", "1": "LuxaCore 적응증의 ferrule 기준(최소 2 mm)보다 작은 값입니다.", "2": "'Need at least 2mm of natural tooth ferrule around tooth'입니다. 정답입니다.", "3": "LuxaCore 적응증의 ferrule 기준(최소 2 mm)보다 작은 값입니다."}, "one": "LuxaCore: ferrule 최소 2 mm, 충전용 아님, 격리 안 되면 amalgam.", "src": "Fillings - Composite, GI.pdf, p.29, 30, 31, 32", "nota": false}, "26": {"id": 26, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "The γ2 phase can be eliminated by having copper content of more than:", "o": ["1%", "3%", "2%", "None of the above"], "a": 3, "qk": "구리 함량이 몇 %를 넘으면 γ2 상을 없앨 수 있는가?", "ok": ["1%", "3%", "2%", "위의 어느 것도 아니다"], "exp": "**γ2(Sn-Hg)**는 아말감에서 가장 불안정하고, 가장 약하며, 부식되기 쉬운 상입니다. 이 상은 **구리(Cu)가 6%를 넘으면(>6%) 없앨 수 있습니다.** Sn-Hg(γ2)가 Ag-Cu와 다시 반응하여 Cu-Sn이 되면서 γ2가 사라지기 때문입니다. 그래서 **고구리 아말감만 씁니다.**\n\n관련 숫자를 정리하면 다음과 같습니다.\n- 저구리 아말감: 구리 5%, γ2 더 많음\n- γ2 제거 기준: 구리 **>6%**\n- 고구리 아말감: 구리 12%, γ2 더 적음\n\n보기에는 6%가 없으므로 '위의 어느 것도 아니다'가 정답입니다.", "why": {"0": "γ2 제거 기준(>6%)이 아닙니다.", "1": "γ2 제거 기준(>6%)이 아닙니다.", "2": "γ2 제거 기준(>6%)이 아닙니다.", "3": "정답인 '6%'가 보기에 없으므로 '위의 어느 것도 아니다'가 정답입니다."}, "one": "Cu >6% → γ2 + Ag-Cu → Cu-Sn, γ2 제거 → 고구리만 사용.", "src": "Fillings - Amalgam.pdf, p.13, 21", "nota": true}, "27": {"id": 27, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "When carving a Class V amalgam restoration, excess is removed with a Hollenbeck carver while maintaining the convexity of the surface contour.", "o": ["True", "False"], "a": 0, "qk": "5급 아말감을 조각(carving)할 때는 Hollenbeck carver로 잉여분을 제거하되 표면 외형의 볼록함(convexity)을 유지한다.", "ok": ["참(True)", "거짓(False)"], "exp": "Class V 아말감 술식의 마지막 단계를 정리해 봅시다.\n\n**충전(Condensation)**: 러버댐을 쓰지 않는 경우에는 압배사(retraction cord)로 치은 조직을 젖혀 놓습니다. 그 다음 통상적인 방법대로 아말감을 다져 넣고 조금 넘치게(overpack) 채웁니다.\n\n**조각(Carving)**: **Hollenbeck carver**로 잉여 아말감을 제거합니다. 이때 **표면 외형의 볼록함(convexity of the surface contour)을 유지**해야 합니다. 마지막에는 **솜 펠렛(cotton pellet)으로 표면을 매끄럽게** 합니다.\n\n이 '볼록함 유지' 원칙은 composite에서 '기존 외형을 따르고 평평하게 하지 말라(Follow the existing contour, Do not flatten!)'와 같은 맥락입니다.", "why": {"1": "False를 고르면 Hollenbeck carver 사용이나 볼록함 유지를 부정하는 것인데, 둘 다 Class V 아말감 carving의 기준 그대로이므로 틀립니다."}, "one": "Class V 아말감 carving = Hollenbeck carver, 볼록함 유지, 솜 펠렛으로 마무리.", "src": "Cl V 2026.pdf, p.42, 67, 68", "nota": false}, "28": {"id": 28, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Fillers make up approximately what percentage of composites?", "o": ["80–90%", "30–70%", "50–75%", "10–20%"], "a": 1, "qk": "필러는 composite의 약 몇 %를 차지하는가?", "ok": ["80–90%", "30–70%", "50–75%", "10–20%"], "exp": "필러(Filler)에 관해 기억할 숫자와 성질은 다음과 같습니다.\n\n- **composite의 30–70%**를 차지합니다.\n- 방사선 불투과성을 만드는 필러: 바륨, 스트론튬, 아연, 이터븀 플루오라이드, 지르코니아\n- 작은 필러는 심미성·연마성을 좋게 하고, 큰 필러는 마모를 더 일으킬 수 있습니다.\n\n이 강의에는 비슷한 퍼센트 숫자가 여럿 나옵니다. 50–75%는 이상적인 상황에서 composite가 중합되는 정도이고, '70%'는 bulk-fill composite에서 중합 수축이 줄어드는 정도입니다. 숫자마다 무엇의 숫자인지 짝지어 두세요.", "why": {"0": "필러 비율의 범위(30–70%)를 벗어난 값입니다.", "1": "'Makes up 30-70% of composites'입니다. 정답입니다.", "2": "50–75%는 이상적인 상황에서 composite가 중합되는 정도(likely only polymerize 50–75% of composites)입니다. 필러 비율이 아닙니다.", "3": "필러 비율의 범위(30–70%)를 벗어난 값입니다."}, "one": "필러 = composite의 30–70%. (50–75% = 중합 정도, 70% = bulk-fill 수축 감소)", "src": "Fillings - Composite, GI.pdf, p.10, 17, 19", "nota": false}, "29": {"id": 29, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Polishing of an amalgam restoration can be completed 1 hour after placement.", "o": ["True", "False"], "a": 1, "qk": "아말감 수복물의 연마는 충전 1시간 후에 할 수 있다.", "ok": ["참(True)", "거짓(False)"], "exp": "아말감 충전 후의 마무리 순서를 정리해 봅시다.\n\n- 아말감은 표면이 아직 반짝일 때(shiny) 조금씩 응축합니다. 반짝인다는 것은 층끼리 붙을 만큼 수은이 충분하다는 뜻입니다.\n- 수은이 풍부한 마지막 층의 표면은 조각하여 제거합니다.\n- 새 혼합물은 이전 혼합물이 가소성(plasticity)을 잃기 전에 추가합니다.\n- **연마는 충전 24시간 후에 할 수 있습니다(24 hours after placement polishing can be completed).**\n- 연마할 때는 과열을 피하기 위해 물을 사용합니다(use water to avoid overheating).\n\n'1시간'은 ADA가 압축 강도 80 MPa에 도달하기를 요구하는 시간입니다. 그 숫자와 헷갈리게 만든 문장이므로 거짓입니다.", "why": {"0": "True를 고르면 1시간 후 연마가 가능하다고 보는 것인데, 아말감 연마는 충전 '24시간 후'이고 물을 써서 과열을 피합니다."}, "one": "아말감 연마 = 24시간 후, 물 사용(과열 방지).", "src": "Fillings - Amalgam.pdf, p.25, 38, 39", "nota": false}, "30": {"id": 30, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "The sandwich technique is used when there is no remaining enamel at the gingival margin.", "o": ["True", "False"], "a": 0, "qk": "샌드위치 기법(sandwich technique)은 치은측 변연(gingival margin)에 남아 있는 법랑질이 없을 때 사용한다.", "ok": ["참(True)", "거짓(False)"], "exp": "병소가 **치관과 치근에 걸쳐(crown and root)** 있으면, 치은측 변연에 **법랑질이 남아 있지 않은(no remaining enamel at the gingival margin)** 경우가 생깁니다.\n\n이럴 때 쓰는 것이 **샌드위치 기법(sandwich technique)**입니다. 글래스아이오노머 기저(glass ionomer base) 위에 레진 composite 베니어(veneer)를 합치는 방법입니다. 순서는 **먼저 RMGI로 수복**하고, **나머지를 composite로 채웁니다.** 단면 그림에서도 치근 쪽이 RMGIC, 치관 쪽이 composite로 그려져 있습니다.\n\n정리하면 병소가 치관 안에만 있으면 composite, 치관과 치근에 걸쳐 있어 치은측에 법랑질이 없으면 sandwich, 치근에만 있으면 RMGIC 쪽으로 생각하면 됩니다.", "why": {"1": "False를 고르면 sandwich technique의 적응증을 부정하는 것인데, 'Used when there is no remaining enamel at the gingival margin'이 바로 그 적응증이므로 틀립니다."}, "one": "치은측 변연에 법랑질 없음 → Sandwich (RMGI 먼저, composite 나중).", "src": "Cl V 2026.pdf, p.46, 47", "nota": false}, "31": {"id": 31, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "Which step is part of the preparation of a CARIOUS Class V lesion but NOT of the minimal preparation of a non-carious lesion?", "o": ["Bevel the enamel with a #201.3 diamond bur", "Place a gingival groove if the lesion is large", "Clean the area with pumice", "Lesion removal with a round bur and spoon excavator"], "a": 3, "qk": "우식성 5급 병소의 형성에는 포함되지만 비우식성 병소의 최소 형성에는 포함되지 않는 단계는?", "ok": ["#201.3 diamond bur로 법랑질 베벨", "병소가 크면 치은측 홈 형성", "퍼미스로 부위 세척", "round bur와 spoon excavator로 병소 제거"], "exp": "두 형성 방법을 나란히 놓고 보면 답이 보입니다.\n\n**비우식성 병소(non-carious lesion), 최소 형성**\n- 퍼미스로 세척\n- #330 diamond로 상아질 거칠게\n- #201.3 diamond로 법랑질 베벨\n- 크면 gingival groove\n\n**우식성 병소(carious lesion)**\n- **round bur와 spoon excavator로 병소 제거**\n- 지지되지 않은 법랑질 제거(remove unsupported enamel)\n- #201.3 diamond로 법랑질 베벨\n\n법랑질 베벨(#201.3)은 두 경우에 모두 있습니다. 반면 **병소 제거**는 감염된 우식 조직이 있는 우식성 병소에만 필요한 단계입니다.", "why": {"0": "우식성·비우식성 두 경우 모두에 있는 단계입니다.", "1": "비우식성 병소의 최소 형성 단계입니다.", "2": "비우식성 병소의 최소 형성 단계입니다.", "3": "병소(우식) 제거는 우식성 병소에만 있는 단계입니다. 정답입니다."}, "one": "우식성만: 병소 제거(round bur + spoon) / 공통: #201.3 베벨.", "src": "Cl V 2026.pdf, p.16, 17", "nota": false}, "32": {"id": 32, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "Abrasion is the loss of tooth structure from chemical dissolution caused by consumption of acidic food and drinks.", "o": ["True", "False"], "a": 1, "qk": "마모(Abrasion)는 산성 음식과 음료 섭취로 인한 화학적 용해(chemical dissolution) 때문에 치질이 소실되는 것이다.", "ok": ["참(True)", "거짓(False)"], "exp": "비우식성 치경부 병소(NCCL, Non-carious Cervical Lesion)는 원인에 따라 세 가지로 나눕니다. 세 가지를 원인으로 정확히 짝지어 두는 것이 핵심입니다.\n\n- **침식(Erosion)**: 화학적 용해(chemical dissolution)로 치질이 소실되는 것입니다. 산성 음식·음료 섭취가 원인입니다.\n- **마모(Abrasion)**: 기계적인 힘(mechanical forces)으로 치질이 소실되는 것입니다. 대표적인 원인이 수평 방향 칫솔질(horizontal toothbrushing)입니다.\n- **굴곡파절/교합성 마모(Abfraction)**: 하중(loading)과 관련된 기계적 응력(mechanical stress) 때문에 치경부가 닳는 것입니다.\n\n문제의 문장은 침식(Erosion)의 정의를 마모(Abrasion)에 붙여 놓은 것이므로 거짓입니다. 시험에서는 이렇게 세 용어의 정의를 서로 바꿔 내는 경우가 많으니, 'Erosion = 화학(산)', 'Abrasion = 칫솔질', 'Abfraction = 교합 하중'으로 외워 두세요.", "why": {"0": "True를 고르면 abrasion을 화학적 원인으로 보는 것인데, 화학적 용해는 erosion이고 abrasion은 수평 칫솔질 같은 기계적 힘에 의한 것이므로 틀립니다."}, "one": "Erosion = 산(화학), Abrasion = 칫솔질(기계), Abfraction = 교합 하중(응력).", "src": "Cl V 2026.pdf, p.5", "nota": false}, "33": {"id": 33, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Amalgam is strongest in compression and weaker in tension and shear.", "o": ["True", "False"], "a": 0, "qk": "아말감은 압축에 가장 강하고 인장(tension)과 전단(shear)에는 약하다.", "ok": ["참(True)", "거짓(False)"], "exp": "**강도(Strength)**는 아말감의 첫 번째 성질입니다.\n\n- **아말감은 압축에 가장 강하고, 인장과 전단에는 약합니다(strongest in compression and weaker in tension and shear).**\n- **그래서 와동 설계는 인장력과 전단력을 줄이도록 해야 합니다(the preparation design should therefore limit amount of tension and shear forces).**\n\n수치도 함께 보면, 완전히 경화되면 압축 강도는 보통 400–500 MPa에 이르고, ADA는 1시간 안에 80 MPa에 도달할 것을 요구합니다. 인장 강도는 50–54 MPa 정도로 압축보다 훨씬 낮습니다.", "why": {"1": "False를 고르면 아말감이 인장이나 전단에 더 강하다는 뜻인데, 아말감은 압축에 가장 강하고 인장·전단에 약하므로 틀립니다."}, "one": "아말감 = 압축에 강, 인장·전단에 약 → 와동 설계로 인장·전단 줄이기.", "src": "Fillings - Amalgam.pdf, p.24, 25", "nota": false}, "34": {"id": 34, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Which statement about mercury safety is correct?", "o": ["Carpet in the operatory helps contain spilled mercury", "Amalgam scraps may be stored in open containers", "Low volume suction is sufficient when handling mercury", "None of the above"], "a": 3, "qk": "수은 안전에 관한 설명으로 옳은 것은?", "ok": ["진료실 카펫은 흘린 수은을 가두는 데 도움이 된다", "아말감 찌꺼기는 열린 용기에 보관해도 된다", "수은을 다룰 때는 저용량 흡입으로 충분하다", "위의 어느 것도 아니다"], "exp": "수은 안전(Safety) 수칙 여섯 가지를 다시 정리합니다.\n\n1. 갓 혼합한 아말감은 만지지 않습니다.\n2. 수은을 다룰 때 마스크와 개인 보호구를 착용합니다.\n3. 수은을 다룰 때 **고용량 흡입(high volume suction)**을 씁니다.\n4. 초음파 아말감 응축기는 절대 쓰지 않습니다.\n5. 청소가 쉽도록 진료실에 **카펫을 깔지 않습니다.**\n6. 아말감 찌꺼기는 **단단히 밀봉한 용기**에 보관합니다.\n\n세 오답 보기는 각각 5번, 6번, 3번을 정반대로 바꾼 것입니다. 옳은 보기가 없으므로 정답은 '위의 어느 것도 아니다'입니다.", "why": {"0": "청소가 쉽도록 진료실에는 카펫을 깔지 않습니다(no carpet in the operatory).", "1": "아말감 찌꺼기는 단단히 밀봉한 용기(tightly sealed containers)에 보관합니다.", "2": "수은을 다룰 때는 고용량 흡입(high volume suction)을 씁니다.", "3": "나머지 세 보기가 모두 안전 수칙과 반대이므로 '위의 어느 것도 아니다'가 정답입니다."}, "one": "수은 안전: 만지지 않기·보호구·고용량 흡입·초음파 응축기 금지·카펫 금지·밀봉 보관.", "src": "Fillings - Amalgam.pdf, p.9", "nota": true}, "35": {"id": 35, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Ultrasonic amalgam condensers are recommended because they reduce mercury exposure.", "o": ["True", "False"], "a": 1, "qk": "초음파 아말감 응축기는 수은 노출을 줄이므로 사용이 권장된다.", "ok": ["참(True)", "거짓(False)"], "exp": "수은을 다룰 때의 안전 수칙(Safety)은 다음과 같습니다.\n\n- 갓 혼합한 아말감은 만지지 않습니다(should not be touched).\n- 수은을 다룰 때 마스크와 개인 보호구를 착용합니다.\n- 수은을 다룰 때 고용량 흡입(high volume suction)을 사용합니다.\n- **초음파 아말감 응축기는 절대 사용하지 않습니다(never to use ultrasonic amalgam condensers).**\n- 청소가 쉽도록 진료실에 카펫을 깔지 않습니다(no carpet in the operatory).\n- 아말감 찌꺼기는 단단히 밀봉한 용기에 보관합니다(tightly sealed containers).\n\n문제는 초음파 응축기를 '권장'한다고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 초음파 응축기를 써도 된다고 보는 것인데, 안전 수칙은 'Never to use ultrasonic amalgam condensers'입니다."}, "one": "초음파 아말감 응축기는 절대 사용 금지.", "src": "Fillings - Amalgam.pdf, p.9", "nota": false}, "36": {"id": 36, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In the conventional Class V cavity criteria, the cavosurface angles should be:", "o": ["90–110°", "60–80°", "120–140°", "45°"], "a": 0, "qk": "전통적인 5급 와동 기준에서 와면각(cavosurface angle)은 얼마여야 하는가?", "ok": ["90–110°", "60–80°", "120–140°", "45°"], "exp": "Class V 와동 기준(Cavity Criteria)은 세 줄로 정리됩니다.\n\n1. **교합측벽과 치은측벽은 치아 외면에 수직(perpendicular to the external tooth surface)**\n2. **와면각(cavosurface angles)은 90–110°**\n3. **축벽 깊이**는 교합측벽 쪽 1.25–1.50 mm, 치은측벽 쪽 1–1.25 mm이고, 치아 외형을 따르며, 상아질 안으로 0.5 mm, 평평하지 않게\n\n함정 보기인 45°는 composite 충전 전 법랑질에 주는 베벨(0.5 mm, 45°)의 각도입니다. '와면각'과 '베벨 각도'를 구분하세요. 참고로 아말감 Class V에서는 모든 외부 벽의 출구각(exit angle)을 90°로 합니다.", "why": {"0": "Class V 와동 기준(cavity criteria)의 와면각 수치 그대로입니다. 정답입니다.", "1": "Class V 와동 기준에 없는 수치입니다. 90°보다 작은 각은 기준 범위 밖입니다.", "2": "Class V 와동 기준에 없는 수치입니다. 110°를 넘으므로 기준 범위 밖입니다.", "3": "45°는 composite를 위해 법랑질에 주는 베벨(bevel)의 각도(0.5 mm, 45 degree)입니다. 와면각 기준과 다릅니다."}, "one": "Class V 와면각 90–110°, 베벨은 0.5 mm·45°.", "src": "Cl V 2026.pdf, p.13, 30", "nota": false}, "37": {"id": 37, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which bonding generation is described as the 'Gold Standard: Most Reliable'?", "o": ["7th generation – one-step self-etching", "5th generation – two-step etch & rinse", "4th generation – three-step etch & rinse", "“8th generation” – universal (total, selective, or self etch)"], "a": 2, "qk": "'Gold Standard: 가장 믿을 만함(Most Reliable)'이라고 설명되는 접착 세대는?", "ok": ["7세대 – 1단계 자가부식", "5세대 – 2단계 etch & rinse", "4세대 – 3단계 etch & rinse", "'8세대' – universal(total, selective, self etch)"], "exp": "**4세대(4th Generation) – 3단계 Etch & Rinse**는 **Gold Standard, 가장 믿을 만한(Most Reliable)** 시스템입니다. 세 단계는 다음과 같습니다.\n\n1. **37% 인산으로 15–20초 산부식 후 세척**\n2. **Primer 15초 도포 후 공기 건조**\n3. **Adhesive 도포 후 광중합**\n\n예: Scotchbond Multi Purpose(3M), All Bond 3(Bisco), Optibond FL(Kerr)\n\n세대가 올라갈수록 단계는 줄지만(3단계 → 2단계 → 1단계), 'gold standard'라는 표현은 가장 단계가 많은 4세대에 붙어 있습니다. 6세대는 가수분해에 더 취약하다는 단점이 함께 나옵니다. 그래서 '최신이 제일 좋다'고 생각하면 틀리기 쉽습니다.", "why": {"0": "7세대는 모든 성분을 하나로 합친 1단계 시스템입니다.", "1": "5세대는 primer와 adhesive를 하나로 합친 2단계 시스템입니다. gold standard라는 설명은 4세대에 있습니다.", "2": "4세대가 'Gold Standard: Most Reliable'입니다. 정답입니다.", "3": "'8세대'는 total etch, selective etch, self etch 모두로 쓸 수 있는 새로운 분류입니다. gold standard라는 설명은 4세대에 있습니다."}, "one": "Gold standard = 4세대(3단계 etch & rinse).", "src": "Fillings - Composite, GI.pdf, p.22, 23, 24, 25, 26", "nota": false}, "38": {"id": 38, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In a Class V amalgam preparation, the exit angle of all external walls should be:", "o": ["45° (beveled)", "90°", "60°", "None of the above"], "a": 1, "qk": "5급 아말감 와동에서 모든 외부 벽의 출구각(exit angle)은?", "ok": ["45°(베벨)", "90°", "60°", "위의 어느 것도 아니다"], "exp": "아말감 Class V의 벽에 관한 두 가지 원칙을 기억하세요.\n\n1. **내부 축벽(internal axial wall)은 외부 곡률과 평행(parallel the external curvature)**하게 합니다.\n2. **모든 외부 벽의 출구각(exit angle)은 90°**입니다.\n\nComposite Class V와 비교하면 차이가 보입니다. Composite를 위한 Class V에서는 #201.3 diamond로 법랑질에 0.5 mm, 45° 베벨을 줍니다. 아말감은 그런 베벨 없이 외부 벽이 90°로 끝납니다. '재료가 바뀌면 변연 처리도 바뀐다'는 점을 기억하세요.", "why": {"0": "45° 베벨은 composite를 위해 법랑질에 주는 것입니다. 아말감 와동의 외부 벽에는 해당하지 않습니다.", "1": "'Exit angle of all external walls at 90°'입니다. 정답입니다.", "2": "아말감 Class V 기준에 없는 각도입니다.", "3": "90°가 보기에 있으므로 틀립니다."}, "one": "Class V 아말감: 외부 벽 출구각 90°, 축벽은 외부 곡률과 평행.", "src": "Cl V 2026.pdf, p.30, 65", "nota": true}, "39": {"id": 39, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Using the traditional classification based on filler size, macro-fillers measure:", "o": ["0.005–0.1 μm", "10–100 μm", "0.1–10 μm", "0.01–0.1 μm"], "a": 1, "qk": "필러 크기에 따른 전통적 분류에서 macro-filler의 크기는?", "ok": ["0.005–0.1 μm", "10–100 μm", "0.1–10 μm", "0.01–0.1 μm"], "exp": "필러 크기 분류(Classification Based on Filler Size)는 전통적 분류와 최근 분류로 나뉩니다.\n\n**전통적(Traditional)**\n- Macro-Fillers: **10–100 μm**\n- Small Fillers: **0.1–10 μm**\n- Micro-Fillers: **0.01–0.1 μm**\n\n**최근(Recent)**\n- Nano-Hybrid\n- Nano-Fillers: **0.005–0.1 μm**\n\n숫자가 10배씩 줄어드는 구조입니다(100 → 10 → 0.1 → 0.01). 이름과 숫자를 짝지어 외워 두세요. 그림에서는 Macro-Filler, Small-Filler, Micro-Filler, Hybrid-Filler 네 가지 모양을 비교합니다.", "why": {"0": "이것은 최근 분류의 nano-filler 크기입니다.", "1": "'Macro-Fillers: 10-100μm'입니다. 정답입니다.", "2": "이것은 small filler의 크기입니다.", "3": "이것은 micro-filler의 크기입니다."}, "one": "Macro 10–100 / Small 0.1–10 / Micro 0.01–0.1 / Nano 0.005–0.1 μm.", "src": "Fillings - Composite, GI.pdf, p.12", "nota": false}, "40": {"id": 40, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Darker shades and greater opacities of composite decrease the depth of light curing.", "o": ["True", "False"], "a": 0, "qk": "Composite의 shade가 어둡고 불투명도(opacity)가 클수록 광중합 깊이가 감소한다.", "ok": ["참(True)", "거짓(False)"], "exp": "광중합형 composite의 **중합 깊이(depth of polymerization)**는 여러 요인에 따라 달라집니다.\n\n1. **광중합기의 광도(intensity)**: 고광도인지 저광도인지\n2. **광원과 composite 사이의 거리**: 광중합기가 얼마나 가까운지\n3. **두께**: 한 번에 약 2 mm 정도만 충분히 경화할 수 있습니다(bulk-fill composite는 4–5 mm 예외). 그래서 치아를 조금씩(incrementally) 채웁니다.\n4. **Composite shade**: 색소는 주로 금속 산화물(metal oxide) 입자로, 빛이 들어가는 깊이에 영향을 줍니다. **어두운 shade와 높은 불투명도는 광중합 깊이를 줄입니다.**\n\n이상적인 상황에서도 composite의 50–75% 정도만 중합된다고 정리되어 있습니다. 문제의 문장은 맞습니다.", "why": {"1": "False를 고르면 shade가 경화 깊이와 무관하다는 뜻인데, 어두운 shade와 높은 불투명도는 광중합 깊이를 줄이므로 틀립니다."}, "one": "어두운 shade·높은 opacity → 광중합 깊이 감소.", "src": "Fillings - Composite, GI.pdf, p.17", "nota": false}, "41": {"id": 41, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "In a conventional Class V preparation, the mesial and distal walls are usually made to converge toward the external tooth surface.", "o": ["True", "False"], "a": 1, "qk": "전통적인 5급 와동 형성에서 근심벽과 원심벽은 보통 치아 외면 쪽으로 수렴(converge)하게 만든다.", "ok": ["참(True)", "거짓(False)"], "exp": "전통적인 5급 와동(conventional Class V cavity preparation)의 벽 이름부터 정리해 봅시다. 바깥쪽 벽(external walls)은 교합측벽(occlusal wall), 치은측벽(gingival wall), 근심벽(mesial wall), 원심벽(distal wall)이고, 안쪽 벽(internal wall)은 축벽(axial wall) 하나입니다.\n\n이 중 **근심벽과 원심벽(M & D walls)은 흔히 바깥쪽으로 벌어지게(diverge)** 형성합니다. 그림을 보면 축벽에서 치아 외면 쪽으로 갈수록 M벽과 D벽 사이가 넓어지는 모양입니다. 같은 단계에서 지지되지 않은 법랑질 제거(removal of unsupported enamel)도 함께 강조됩니다.\n\n반면 교합측벽과 치은측벽은 '치아 외면에 수직(perpendicular to the external tooth surface)'이 기준입니다. 즉, M·D벽 = diverge, O·G벽 = 외면에 수직, 이렇게 따로 기억해야 합니다. 문제는 M·D벽이 '수렴한다'고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 M·D벽이 수렴한다고 보는 것인데, Class V에서 M & D walls는 'often diverge'(벌어짐)로 형성하므로 틀립니다."}, "one": "Class V: M·D벽은 벌어지게(diverge), O·G벽은 치아 외면에 수직.", "src": "Cl V 2026.pdf, p.12, 13, 14", "nota": false}, "42": {"id": 42, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "Which of the following is NOT a type of non-carious cervical lesion (NCCL)?", "o": ["Abfraction", "Abrasion", "Recurrent", "Erosion"], "a": 2, "qk": "다음 중 비우식성 치경부 병소(NCCL)의 종류가 아닌 것은?", "ok": ["굴곡파절성 병소(Abfraction)", "마모(Abrasion)", "재발성(Recurrent)", "침식(Erosion)"], "exp": "치경부 병소(cervical lesions)는 원인에 따라 세 가지로 나뉩니다. 우식성 병소(Carious lesion), 비우식성 치경부 병소(NCCL), 그리고 둘이 함께 있는 경우(A combination of both)입니다.\n\n**우식성 병소(Caries)**는 세균성 치태(bacterial plaque)가 원인이고, 일차성(Primary)과 재발성(Recurrent)으로 나눕니다.\n\n**NCCL**은 세균이 아닌 원인으로 치질이 없어지는 것이고, 침식(Erosion), 마모(Abrasion), 굴곡파절성 병소(Abfraction) 세 가지입니다.\n\n따라서 'Recurrent'는 우식성 병소 쪽 용어이고, NCCL의 종류가 아닙니다. 시험에서는 이렇게 '우식성 분류 용어'를 NCCL 보기 속에 섞어 넣는 경우가 많습니다.", "why": {"0": "하중 관련 기계적 응력으로 생기는 NCCL입니다.", "1": "수평 칫솔질 같은 기계적 힘으로 생기는 NCCL입니다.", "2": "재발성(recurrent)은 우식(caries)을 일차성(primary)과 재발성(recurrent)으로 나눌 때 쓰는 말로, 세균성 치태(bacterial plaque)가 원인인 '우식성 병소'의 종류입니다. 그래서 NCCL이 아닙니다.", "3": "산성 음식·음료에 의한 화학적 용해로 생기는 NCCL입니다."}, "one": "NCCL = Erosion·Abrasion·Abfraction / Primary·Recurrent는 우식(caries) 분류.", "src": "Cl V 2026.pdf, p.3, 4, 5", "nota": false}, "43": {"id": 43, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Creep is found more at marginal areas because they tend to have more residual mercury.", "o": ["True", "False"], "a": 0, "qk": "변연 부위는 잔류 수은이 더 많은 경향이 있어서 크리프(creep)가 더 많이 나타난다.", "ok": ["참(True)", "거짓(False)"], "exp": "**크리프(Creep)**는 얇은 변연이 한계를 넘어 '늘어나는(stretch)' 것, 즉 **소성 변형(plastic deformation)**입니다. 씹는 힘이 아말감에 가해지면 크리프가 생깁니다.\n\n**크리프를 늘리는 요인**은 다음과 같습니다.\n- 저구리(low copper) 합금은 크리프가 더 큽니다.\n- 충전할 때 응축 압력이 낮아서 생긴 잔류 수은(residual mercury)\n- 혼합(trituration)과 응축(condensation) 사이의 지연\n- **변연 부위는 잔류 수은이 더 많은 경향이 있어서 크리프가 더 많이 나타납니다.**\n\n문제의 문장은 마지막 항목 그대로이므로 참입니다.", "why": {"1": "False를 고르면 변연 부위가 크리프와 무관하다는 뜻인데, 변연은 잔류 수은이 많아 크리프가 더 많이 나타나므로 틀립니다."}, "one": "Creep↑: 저구리, 잔류 수은(낮은 응축압), 혼합-응축 지연, 변연부.", "src": "Fillings - Amalgam.pdf, p.32, 33", "nota": false}, "44": {"id": 44, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "In a conventional Class V preparation, the axial wall should follow the contour of the tooth and should not be flat.", "o": ["True", "False"], "a": 0, "qk": "전통적인 5급 와동에서 축벽(axial wall)은 치아의 외형(contour)을 따라야 하며 평평하면 안 된다.", "ok": ["참(True)", "거짓(False)"], "exp": "5급 와동의 안쪽 바닥은 1급의 치수벽(pulpal floor)이 아니라 **축벽(axial wall)**입니다. 축벽은 **치아의 외형을 따라(follow contour of the tooth) 볼록하게** 형성하고, 평평하게 만들지 않습니다(not flat). 깊이 기준도 함께 기억하세요. 축벽 깊이는 교합측벽 쪽에서 1.25–1.50 mm, 치은측벽 쪽에서 1–1.25 mm이고, 상아질 안으로 0.5 mm는 들어가야 합니다.\n\nAmalgam으로 Class V를 할 때도 같은 원칙이 나옵니다. 내부 축벽은 외부 곡률에 평행해야 한다(internal axial wall should parallel the external curvature)는 것입니다. 재료와 상관없이 'Class V 축벽 = 외형 따라 볼록'으로 기억하면 됩니다.", "why": {"1": "False를 고르면 축벽을 평평하게 만들어도 된다는 뜻이 되는데, 축벽은 'follow contour of the tooth, not flat'이 기준이므로 틀립니다."}, "one": "Class V 축벽 = 치아 외형 따라 볼록, 평평하게(flat) 만들지 않는다.", "src": "Cl V 2026.pdf, p.13, 65", "nota": false}, "45": {"id": 45, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Resin-modified glass ionomer (RMGI) releases more fluoride than conventional glass ionomer.", "o": ["True", "False"], "a": 1, "qk": "레진강화형 글래스아이오노머(RMGI)는 일반 글래스아이오노머보다 불소를 더 많이 방출한다.", "ok": ["참(True)", "거짓(False)"], "exp": "**레진강화형 글래스아이오노머(Resin Modified Glass Ionomer, RMGI)**의 장점은 다음과 같습니다.\n\n- 레진이 들어 있어서 글래스아이오노머보다 **더 심미적**입니다.\n- **불소 방출: composite보다는 많고, 글래스아이오노머보다는 적습니다(releases more fluoride than composite but less than glass ionomer).**\n- 빛을 쬐면 바로 굳기 때문에 바로 마무리(finish)할 수 있습니다.\n- 글래스아이오노머보다 더 강합니다(stronger).\n- 적용: 우식 위험이 높은 환자(high caries risk patients)\n\n불소 방출량 순서는 **GI > RMGI > Composite**입니다. 문제는 RMGI가 GI보다 많다고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 RMGI가 GI보다 불소를 많이 낸다고 보는 것인데, RMGI는 composite보다 많고 GI보다는 적게 방출합니다."}, "one": "불소 방출: GI > RMGI > Composite. RMGI는 더 심미적이고 더 강하며 바로 마무리 가능.", "src": "Fillings - Composite, GI.pdf, p.40", "nota": false}, "46": {"id": 46, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "Which statement about the Fuji II LC Class V procedure is correct?", "o": ["GC Fuji II LC Coat is applied and light cured for 20 seconds", "The activated capsule is mixed for 20 seconds", "After bulk filling and shaping, the material is light cured for 10 seconds", "None of the above"], "a": 3, "qk": "Fuji II LC 5급 술식에 대한 설명으로 옳은 것은?", "ok": ["GC Fuji II LC Coat를 바르고 20초 광중합한다", "활성화한 캡슐을 20초 혼합한다", "bulk fill 후 형태를 만들고 10초 광중합한다", "위의 어느 것도 아니다"], "exp": "이 문제는 Fuji II LC 술식에 나오는 세 개의 시간을 정확히 구분하는지 묻습니다.\n\n- 캡슐 혼합: **10초**\n- 와동 전체에 넣고(bulk fill) 형태를 만든 뒤 광중합: **20초**\n- 마무리·연마 후 GC Fuji II LC Coat 바르고 광중합: **10초**\n\n세 오답 보기는 이 숫자들을 서로 바꿔 놓았습니다. 그래서 옳은 보기가 하나도 없고, 정답은 '위의 어느 것도 아니다'입니다.\n\nCoat는 G-COAT PLUS라는 이름으로도 나오며, Fuji II LC와 결합하여 마모에 강한 표면을 만들고 수복물의 수명을 높여 줍니다.", "why": {"0": "Coat의 광중합은 10초(light cure for 10 seconds)입니다.", "1": "혼합은 10초(Mix for 10 Sec)입니다.", "2": "재료를 넣은 뒤의 광중합은 20초(Light cure for 20 Sec)입니다.", "3": "나머지 세 보기가 모두 시간이 틀렸으므로 '위의 어느 것도 아니다'가 정답입니다. 실제 값은 혼합 10초, 재료 광중합 20초, Coat 광중합 10초입니다."}, "one": "Fuji II LC 시간: 혼합 10 / 광중합 20 / Coat 10초.", "src": "Cl V 2026.pdf, p.52, 53", "nota": true}, "47": {"id": 47, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Which of the following does NOT increase the amount of creep in amalgam?", "o": ["Residual mercury due to low condensation pressure", "Using low copper amalgam alloys", "Delay between trituration and condensation", "High condensation pressure during placement"], "a": 3, "qk": "다음 중 아말감의 크리프를 증가시키지 않는 것은?", "ok": ["낮은 응축 압력으로 생긴 잔류 수은", "저구리 아말감 합금 사용", "혼합과 응축 사이의 지연", "충전 시 높은 응축 압력"], "exp": "**크리프(Creep)**는 얇은 변연이 한계를 넘어 늘어나는 소성 변형(plastic deformation)이고, 씹는 힘 때문에 생깁니다.\n\n**크리프를 늘리는 요인**\n- 저구리 합금(low copper alloys)\n- 충전 시 **낮은 응축 압력** 때문에 남은 **잔류 수은**\n- 혼합(trituration)과 응축(condensation) 사이의 지연\n- 변연 부위(잔류 수은이 더 많음)\n\n**응축(Condensation)**에 관해서는 '수은을 짜내고 합금을 더 치밀하게 만들기 위해 좋은 압력이 필요하며, 그래야 강도가 좋아진다'고 정리됩니다. 즉 높은 응축 압력은 잔류 수은을 줄이는 쪽이고, 크리프를 늘리는 요인은 그 반대인 '낮은' 응축 압력입니다.", "why": {"0": "응축 압력이 낮아 남은 잔류 수은은 크리프를 늘립니다.", "1": "저구리 합금은 크리프가 더 큽니다.", "2": "크리프를 늘리는 요인입니다.", "3": "크리프를 늘리는 것은 '낮은' 응축 압력 때문에 생긴 잔류 수은입니다. 응축 압력이 높으면 수은이 짜여 나와 밀도가 높아지므로, 이것은 크리프를 늘리는 요인이 아닙니다."}, "one": "Creep↑ = 저구리·잔류 수은(낮은 응축압)·혼합-응축 지연·변연부.", "src": "Fillings - Amalgam.pdf, p.28, 33", "nota": false}, "48": {"id": 48, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "The photosensitizer camphorquinone reacts to which wavelength range?", "o": ["300–400 nm", "400–500 nm", "500–600 nm", "None of the above"], "a": 1, "qk": "광감작제인 캄포퀴논(camphorquinone)이 반응하는 파장 범위는?", "ok": ["300–400 nm", "400–500 nm", "500–600 nm", "위의 어느 것도 아니다"], "exp": "광중합형(Light-Cure) composite는 한 페이스트에 광감작제(활성제)인 **캄포퀴논(camphorquinone)**과 개시제인 **DMAEMA**가 함께 들어 있습니다. 빛을 받으면 캄포퀴논이 DMAEMA를 활성화해 자유 라디칼을 만들고, 이것이 경화를 시작합니다.\n\n광감작제는 **특정 파장(400–500 nm)**에 반응합니다. **그래서 우리가 쓰는 광중합기의 빛이 파란색입니다(why the light we use is blue in color).**\n\n'광중합기 = 파란 빛 = 400–500 nm = 캄포퀴논'을 한 줄로 묶어 기억하세요.", "why": {"0": "캄포퀴논이 반응하는 범위(400–500 nm)가 아닙니다.", "1": "'Photosensitizer reacts to specific wavelength (400-500nm)'입니다. 정답입니다.", "2": "캄포퀴논이 반응하는 범위(400–500 nm)가 아닙니다.", "3": "400–500 nm가 보기에 있으므로 틀립니다."}, "one": "캄포퀴논 = 400–500 nm → 그래서 광중합기 빛은 파란색.", "src": "Fillings - Composite, GI.pdf, p.16", "nota": true}, "49": {"id": 49, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Which of the following is NOT an advantage of amalgam?", "o": ["Strong bond to tooth structure", "Low cost", "Technique insensitivity", "Durability of the restoration"], "a": 0, "qk": "다음 중 아말감의 장점이 아닌 것은?", "ok": ["치질에 대한 강한 결합", "낮은 비용", "술식에 덜 민감함", "수복물의 내구성(Durability)"], "exp": "아말감의 장점과 단점을 composite와 비교하며 정리해 봅시다.\n\n**장점(Advantages)**\n- **낮은 비용**: composite는 마이크로브러시, 산부식제, 접착제, composite가 필요하지만 아말감은 아말감 캡슐 하나입니다.\n- **내구성**: 인장 강도(TS)·압축 강도(CS) 표에는 아말감 TS 48–69 MPa, CS 310–483 MPa, composite TS 34–62 MPa, CS 200–345 MPa, 법랑질 TS 10 MPa, CS 400 MPa가 제시됩니다.\n- **술식에 덜 민감함(technique insensitivity)**\n\n**단점(Disadvantages)**\n- 비심미적 색\n- **결합 강도가 composite보다 훨씬 약함**\n- 독성 우려(수은)\n\n'강한 결합'은 composite의 장점(bonds to tooth structure)입니다. 아말감에서는 단점 쪽에 있습니다.", "why": {"0": "아말감의 결합 강도는 composite보다 훨씬 약하다는 것이 '단점'입니다. 그래서 장점이 아닙니다.", "1": "아말감의 장점입니다. composite는 마이크로브러시, 산부식제, 접착제, composite가 필요하지만 아말감은 캡슐 하나면 됩니다.", "2": "아말감의 장점입니다. composite는 반대로 술식에 민감한 것(technique sensitive)이 단점입니다.", "3": "아말감의 장점입니다."}, "one": "아말감 장점 = 비용·내구성·술식 비민감성 / 결합은 약하다(단점).", "src": "Fillings - Amalgam.pdf, p.4, 5", "nota": false}, "50": {"id": 50, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which of the following is NOT a contraindication for composite resin?", "o": ["Small to moderate lesions", "Difficult moisture control", "Poor oral hygiene", "Cusp replacement"], "a": 0, "qk": "다음 중 composite resin의 금기증(contraindication)이 아닌 것은?", "ok": ["작은~중간 크기의 병소", "어려운 방습", "불량한 구강위생", "교두 대체"], "exp": "Composite resin의 장단점, 적응증과 금기증을 한꺼번에 정리해 봅시다.\n\n**장점(Advantages)**: 치아에 결합함, 치아색, 유동성(fluid)이나 페이스트(paste) 등 성질을 다르게 만들 수 있음\n**적응증(Indications)**: 심미 수복, **작은~중간 크기 병소(small to moderate lesions)**, 좋은 격리가 가능한 경우\n\n**단점(Disadvantages)**: 술식에 민감함(technique sensitive, 단계가 많음), 최적의 격리가 필요함(rubber dam)\n**금기증(Contraindications)**: **어려운 방습(difficult moisture control)**, **교두 대체(cusp replacement)**, **불량한 구강위생(poor oral hygiene)**\n\n'작은~중간 크기 병소'는 적응증 쪽에 있으므로 금기증이 아닙니다. 적응증과 금기증을 섞어 내는 전형적인 함정입니다.", "why": {"0": "작은~중간 크기 병소는 composite의 '적응증(indication)'입니다. 그래서 금기증이 아닙니다.", "1": "Composite의 금기증입니다. Composite는 최적의 격리(rubber dam)가 필요합니다.", "2": "Composite의 금기증입니다.", "3": "Composite의 금기증입니다."}, "one": "Composite 금기증 = 방습 어려움 · 교두 대체 · 구강위생 불량.", "src": "Fillings - Composite, GI.pdf, p.4, 5", "nota": false}, "51": {"id": 51, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "High copper amalgam was created to overcome the inferior properties of low copper amalgam. Which of the following is NOT one of those inferior properties?", "o": ["Long working time", "Increased dimensional change", "Low early strength", "Higher residual mercury"], "a": 0, "qk": "고구리 아말감은 저구리 아말감의 나쁜 성질을 극복하려고 만들어졌다. 다음 중 저구리 아말감의 나쁜 성질이 아닌 것은?", "ok": ["긴 작업 시간", "치수 변화 증가", "낮은 초기 강도", "잔류 수은 증가"], "exp": "저구리 아말감(Low Copper Amalgam)의 나쁜 성질(inferior properties)은 여섯 가지입니다.\n\n1. **짧은 작업 시간(short working time)**\n2. 치수 변화 증가(increased dimensional change)\n3. 마무리 어려움(difficulty finishing)\n4. 잔류 수은 증가(higher residual mercury)\n5. 높은 크리프(high creep)\n6. 낮은 초기 강도(low early strength)\n\n이것을 극복하려고 구리를 5%에서 12%로 늘린 고구리 아말감을 만들었습니다. 오답 보기는 '짧은'을 '긴'으로 뒤집은 것입니다. 작업 시간이 긴 것은 장점이지 나쁜 성질이 아닙니다.", "why": {"0": "저구리 아말감의 문제는 '짧은' 작업 시간(short working time)입니다. 그래서 이것이 '아닌 것'입니다.", "1": "저구리 아말감의 나쁜 성질입니다.", "2": "저구리 아말감의 나쁜 성질입니다.", "3": "저구리 아말감의 나쁜 성질입니다."}, "one": "저구리 단점: 짧은 작업시간·치수변화↑·마무리 어려움·잔류수은↑·크리프↑·초기강도↓.", "src": "Fillings - Amalgam.pdf, p.14, 15", "nota": false}, "52": {"id": 52, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Glass ionomer bonds to tooth structure by:", "o": ["Mechanical retention grooves only", "A chemical reaction with Ca²⁺ (chelation)", "Resin tags forming a hybrid layer after phosphoric acid etching", "None of the above"], "a": 1, "qk": "글래스아이오노머가 치질에 결합하는 방식은?", "ok": ["기계적 유지구만으로", "Ca²⁺와의 화학 반응(킬레이션, chelation)", "인산 산부식 후 혼성층을 이루는 레진 태그", "위의 어느 것도 아니다"], "exp": "글래스아이오노머의 결합 원리를 조성부터 따라가 봅시다.\n\n**조성(Composition)**\n- 가루(Powder): **칼슘 플루오로알루미노실리케이트 유리(Calcium Fluoroaluminosilicate Glass: Ca, F, Al, SiO₂)**\n- 액(Liquid): **폴리아크릴산(polyacrylic acid)**을 동결건조하여 가루와 합쳐 두고 물과 섞기 때문에, 현대 GI 시멘트는 액이 주로 물일 수 있습니다. 그 밖에 이타콘산, 말레인산, 트리카르복실산 같은 산도 쓰입니다.\n\n**화학 반응(Chemical Reaction)**: 폴리아크릴산 사슬이 칼슘에 의해 교차결합됩니다(킬레이션, chelation).\n**치아와의 결합**: **화학적 접착(chemical adhesion to tooth)**, 즉 **Ca²⁺와의 화학 반응(킬레이션)**입니다.\n\n그래서 GI에는 20% 폴리아크릴산 컨디셔너를 쓰고, 화학 결합을 약하게 하는 인산은 쓰지 않습니다. 샌드위치 기법에서 'GIC–치아 = 화학적 결합'이라고 한 것도 같은 내용입니다.", "why": {"0": "유지구로 붙이는 것은 아말감 Class V의 방식입니다. GI는 화학적으로 결합합니다.", "1": "'Bonds to tooth by chemical reaction with Ca²⁺: Chelation'입니다. 정답입니다.", "2": "이것은 composite 접착(etchant → primer → adhesive)의 원리입니다. 게다가 인산은 GI의 화학 결합을 약하게 하므로 GI에는 쓰지 않습니다.", "3": "첫 번째 보기가 정답이므로 틀립니다."}, "one": "GI 결합 = Ca²⁺ 킬레이션(화학적). 인산 금지.", "src": "Fillings - Composite, GI.pdf, p.34, 36, 37 / Cl V 2026.pdf, p.48", "nota": true}, "53": {"id": 53, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "Gingival excess of a Class V composite restoration, if required, is removed with:", "o": ["Hollenbeck carver", "IPC", "Explorer", "None of the above"], "a": 3, "qk": "5급 composite 수복물의 치은 쪽 잉여분을 필요하면 무엇으로 제거하는가?", "ok": ["Hollenbeck carver", "IPC", "Explorer(탐침)", "위의 어느 것도 아니다"], "exp": "Composite 마무리 단계에서 기구별 역할을 정리해 봅시다.\n\n- 큰 잉여분(gross excess) 제거와 외형 만들기: **finishing bur**\n- 변연 마무리: **coarse, medium grit Sof-Lex disc**\n- **치은 쪽 잉여분 제거: surgical Bard-Parker #12 blade**(필요한 경우)\n- 변연 확인: **explorer**\n- 연마: 점점 더 고운 sanding disc, 선택적으로 polishing cup과 brush\n\n보기에는 Bard-Parker #12 blade가 없습니다. Hollenbeck carver는 아말감용, IPC는 충전 기구, explorer는 확인용입니다. 그래서 '위의 어느 것도 아니다'가 정답입니다.", "why": {"0": "Hollenbeck carver는 Class V 아말감에서 잉여 아말감을 조각(carving)할 때 씁니다. composite의 치은 쪽 잉여분 제거용이 아닙니다.", "1": "IPC는 composite 충전 장면에 함께 나오는 충전 기구입니다. 잉여분 제거용으로 제시되지 않았습니다.", "2": "Explorer는 외형을 만든 뒤 변연을 '확인'하는(check margins) 데 씁니다. 잉여분을 제거하는 기구가 아닙니다.", "3": "치은 쪽 잉여분은 surgical Bard-Parker #12 blade로 제거합니다. 이 기구가 보기에 없으므로 '위의 어느 것도 아니다'가 정답입니다."}, "one": "Composite 치은 쪽 잉여분 = Bard-Parker #12 blade.", "src": "Cl V 2026.pdf, p.36, 40, 41, 42, 68", "nota": true}, "54": {"id": 54, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Glass ionomer releases fluoride, and although this release diminishes over time, it can be recharged from other fluoride sources.", "o": ["True", "False"], "a": 0, "qk": "글래스아이오노머는 불소를 방출하며, 시간이 지나면 방출량이 줄지만 다른 불소원으로부터 재충전될 수 있다.", "ok": ["참(True)", "거짓(False)"], "exp": "**글래스아이오노머(Glass Ionomer)의 장점(Advantages)**은 다음과 같습니다.\n\n- 광중합형(RMGI, Fuji II LC)과 자가중합형(Fuji XI)이 있습니다.\n- **불소를 방출합니다(releases fluoride).**\n  - 시간이 지나면 불소 방출이 줄어듭니다(diminishes over time).\n  - **다른 불소원으로부터 불소를 재충전할 수 있습니다(can recharge fluoride).**\n- 치아의 Ca²⁺와 화학 반응하여 결합합니다(킬레이션, chelation).\n\n문제의 문장은 '방출 → 감소 → 재충전'을 모두 맞게 썼으므로 참입니다.", "why": {"1": "False를 고르면 GI가 불소를 재충전할 수 없다는 뜻인데, 'Can recharge fluoride from other fluoride sources'가 GI의 장점으로 제시되어 있으므로 틀립니다."}, "one": "GI 불소: 방출 → 시간 지나면 감소 → 다른 불소원으로 재충전.", "src": "Fillings - Composite, GI.pdf, p.34", "nota": false}, "55": {"id": 55, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "A DECREASE in mercury content of an amalgam mix leads to:", "o": ["Delayed expansion", "More of the amalgam ends up in the γ2 phase, making it weaker", "A dry, granular mix causing a rough, pitted surface that promotes corrosion", "None of the above"], "a": 2, "qk": "아말감 혼합물의 수은 함량이 '감소'하면 어떻게 되는가?", "ok": ["지연 팽창", "아말감이 γ2 상 쪽으로 가서 더 약해진다", "건조하고 알갱이진 혼합물이 되어 부식을 촉진하는 거칠고 패인 표면이 생긴다", "위의 어느 것도 아니다"], "exp": "강도에 영향을 주는 요인 중 **수은 함량(Mercury Content)**은 '많아도 문제, 적어도 문제'입니다.\n\n- **수은 함량 증가** → 아말감이 **γ2 상**으로 → **더 약해짐**\n- **수은 함량 감소** → **건조하고 알갱이진(dry, granular) 혼합물** → **거칠고 패인(rough, pitted) 표면** → **부식 촉진**\n\n두 결과를 서로 바꿔 내기 쉬우니 방향을 정확히 기억하세요. 지연 팽창은 수은 함량이 아니라 아연과 수분 오염의 문제입니다.", "why": {"0": "지연 팽창은 아연이 든 아말감이 수분에 오염되었을 때 생깁니다.", "1": "이것은 수은 함량이 '증가'했을 때의 결과입니다.", "2": "'Decrease in mercury content leads to dry, granular mix; causing rough, pitted surface that promotes corrosion'입니다. 정답입니다.", "3": "첫 번째 보기가 정답이므로 틀립니다."}, "one": "수은↑ → γ2·약화 / 수은↓ → 건조·알갱이 → 거칠고 패인 표면 → 부식.", "src": "Fillings - Amalgam.pdf, p.16, 27, 30", "nota": true}, "56": {"id": 56, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which of the following is a coupling agent (adhesive monomer) in composite resin?", "o": ["Colloidal silica", "Bis-GMA", "MDP", "TEGDMA"], "a": 2, "qk": "다음 중 composite resin의 결합제(coupling agent, 접착성 단량체)에 해당하는 것은?", "ok": ["콜로이드성 실리카(Colloidal silica)", "Bis-GMA (Bisphenol A-Glycidyl Methacrylate)", "MDP (10-Methacryloxydecamethylene Phosphoric Acid)", "TEGDMA (Triethylene Glycol Dimethacrylate)"], "exp": "Composite resin = **레진 기질(Resin Matrix) + 필러(Fillers) + 결합제(Coupling Agent, Adhesive Monomers)**입니다. 성분 이름이 길어서 헷갈리기 쉬우니 칸별로 외워 두세요.\n\n- **레진 기질**: Bis-GMA, UDMA, TEGDMA\n- **필러**: Silica, Glass Particles, Colloidal Silica\n- **결합제(접착성 단량체)**: **HEMA**, **4-META**, **MDP**\n\n이름 끝이 비슷한 HEMA(결합제)와 Bis-GMA(레진 기질)를 헷갈리지 않도록 주의하세요.", "why": {"0": "콜로이드성 실리카는 필러(fillers)의 성분입니다.", "1": "Bis-GMA는 레진 기질(resin matrix)의 성분입니다.", "2": "MDP는 HEMA, 4-META와 함께 결합제(adhesive monomers) 목록에 있습니다. 정답입니다.", "3": "TEGDMA도 레진 기질(resin matrix)의 성분입니다."}, "one": "결합제 = HEMA · 4-META · MDP / 레진 기질 = Bis-GMA · UDMA · TEGDMA.", "src": "Fillings - Composite, GI.pdf, p.6, 7, 8", "nota": false}, "57": {"id": 57, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "After light curing Fuji II LC in a Class V restoration, finishing and polishing are performed under water spray.", "o": ["True", "False"], "a": 0, "qk": "5급 수복에서 Fuji II LC를 광중합한 후, 마무리와 연마는 물 분무(water spray) 하에서 시행한다.", "ok": ["참(True)", "거짓(False)"], "exp": "Fuji II LC 술식의 뒷부분을 정리해 봅시다. 와동 전체에 재료를 넣고(bulk fill) 형태를 만든 다음 **20초 광중합**합니다. 그 다음 **물 분무 하에서 마무리와 연마(finish and polish under water spray)**를 합니다. 마지막으로 **GC Fuji II LC Coat를 바르고 10초 광중합**합니다.\n\n마지막 코팅(G-COAT PLUS)은 Fuji II LC와 결합하여 마모에 강한 표면을 만들어 주고, 그 결과 수복물의 수명(longevity)을 높여 줍니다.\n\n마무리할 때는 coarse, medium Sof-Lex disk와 저속 핸드피스(slow speed hand piece)로 시작한다는 것도 함께 기억해 두세요.", "why": {"1": "False를 고르면 물 분무 없이 마무리한다는 뜻이 되는데, 9번 단계가 'Finish and Polish under water spray'이므로 틀립니다."}, "one": "Fuji II LC: 20초 광중합 → 물 분무 하 마무리·연마 → Coat 바르고 10초 광중합.", "src": "Cl V 2026.pdf, p.53, 59", "nota": false}, "58": {"id": 58, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "In the sandwich technique for Class V, composite is placed first at the gingival portion and RMGI is then placed as the outer veneer.", "o": ["True", "False"], "a": 1, "qk": "5급 샌드위치 기법에서는 composite를 먼저 치은 쪽에 넣고, 그 위에 RMGI를 바깥 베니어로 덮는다.", "ok": ["참(True)", "거짓(False)"], "exp": "샌드위치 기법의 정의를 정확히 기억해야 풀 수 있는 문제입니다. 샌드위치 기법은 **글래스아이오노머 기저(glass ionomer base)에 레진 composite 베니어(veneer of resin composite)를 합친 것**입니다. 즉, 아래(기저, base)는 GI 계열이고, 바깥 베니어는 composite입니다.\n\n순서도 정해져 있습니다. **먼저 RMGI로 수복(restore first with RMGI)**하고, **나머지를 composite로 채웁니다(the rest with composite filling).** 단면 그림을 보면 치근 쪽(치은측 변연 쪽)이 RMGIC이고, 치관 쪽 바깥이 composite입니다.\n\n문제는 순서와 역할을 정반대로 바꿔 놓았습니다. composite가 먼저, RMGI가 베니어라고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 composite가 기저이고 RMGI가 베니어라고 보는 것인데, 실제는 GI 기저 + composite 베니어이고 RMGI를 먼저 넣으므로 틀립니다."}, "one": "Sandwich = GI(RMGI) base 먼저 + composite veneer 나중.", "src": "Cl V 2026.pdf, p.47, 48", "nota": false}, "59": {"id": 59, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "The bond strength of amalgam is stronger than that of composite.", "o": ["True", "False"], "a": 1, "qk": "아말감의 결합 강도는 composite보다 강하다.", "ok": ["참(True)", "거짓(False)"], "exp": "아말감의 단점(Disadvantages)은 세 가지입니다.\n\n1. 비심미적인 색(unaesthetic color)\n2. **결합 강도가 composite보다 훨씬 약함(bond strength much weaker than composite)**. 다만 아말감 접착(amalgam bonding)이라는 것도 있기는 합니다.\n3. 독성 우려(toxicity concerns): 수은(mercury)\n\n반면 장점(Advantages)은 낮은 비용, 내구성(durability), 술식에 덜 민감함(technique insensitivity)입니다. 즉, 아말감이 composite보다 나은 점은 '결합'이 아니라 '비용, 내구성, 술식 민감도'입니다. 참고로 Class V 강의에서도 아말감은 기계적 유지 형태(retention groove)와 함께 쓰라고 했습니다.", "why": {"0": "True를 고르면 아말감의 결합이 더 강하다고 보는 것인데, 아말감의 결합 강도는 composite보다 '훨씬 약하다'는 것이 단점으로 제시되어 있습니다."}, "one": "아말감 결합 강도 ≪ composite. 장점은 비용·내구성·술식 비민감성.", "src": "Fillings - Amalgam.pdf, p.4, 5 / Cl V 2026.pdf, p.61", "nota": false}, "60": {"id": 60, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In the Fuji II LC (RMGI) Class V procedure, GC Cavity Conditioner is applied for:", "o": ["60 seconds", "10 seconds", "20 seconds", "5 seconds"], "a": 1, "qk": "Fuji II LC(RMGI) 5급 술식에서 GC Cavity Conditioner의 도포 시간은?", "ok": ["60초", "10초", "20초", "5초"], "exp": "Fuji II LC 술식의 숫자를 순서대로 정리하면 다음과 같습니다.\n\n1. **GC Cavity Conditioner(폴리아크릴산, polyacrylic acid) 10초** 도포\n2. 컨디셔너가 없어질 때까지 물로 충분히 헹굼\n3. 캡슐을 흔들어 가루를 풀기\n4. 플런저를 누르고 applier에 넣어 **한 번 클릭**\n5. **10초 혼합**\n6. applier에 넣고 **두 번 클릭해 prime**한 뒤 천천히 주입\n7. 와동 전체에 넣고(bulk fill) 형태 만들기\n8. **20초 광중합**\n9. 물 분무 하에서 마무리·연마\n10. **GC Fuji II LC Coat 바르고 10초 광중합**\n\n컨디셔너는 산부식제(etch) 역할을 하지만, composite 술식의 인산 산부식과는 다른 단계이니 시간도 따로 기억하세요.", "why": {"0": "60초는 composite 술식에서 Consepsis를 도포하는 시간입니다.", "1": "'Apply GC Cavity Conditioner … for 10 Sec'입니다. 정답입니다.", "2": "20초는 Fuji II LC를 와동에 넣은 뒤의 광중합 시간입니다. 컨디셔너 도포 시간이 아닙니다.", "3": "5초는 composite 술식에서 Consepsis 도포 후 약한 바람으로 건조하는 시간입니다."}, "one": "Fuji II LC: 컨디셔너 10초 → 혼합 10초 → 광중합 20초 → Coat 10초.", "src": "Cl V 2026.pdf, p.35, 52, 53", "nota": false}, "61": {"id": 61, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In the Class V selective-etch composite protocol, the enamel is etched for:", "o": ["30 seconds", "10 seconds", "20 seconds", "60 seconds"], "a": 2, "qk": "5급 composite의 선택적 산부식(selective etch) 술식에서 법랑질 산부식 시간은?", "ok": ["30초", "10초", "20초", "60초"], "exp": "Class V composite 수복(Restoration Placement, Composite Resin)의 접착 단계는 다음 순서입니다.\n\n1. **선택적 산부식(Selective etch)**: **법랑질만 20초** 산부식합니다.\n2. 산부식제가 없어질 때까지 물로 충분히 헹굽니다. 이때 고용량 흡입기(high volume suction)를 써서 **상아질은 촉촉하게(wet dentin)** 유지합니다.\n3. **Consepsis 60초** 도포 후 약한 바람으로 5초 건조합니다.\n4. **Scotchbond Universal Plus**를 **2겹, 20초** 바르고 얇게 편 뒤 **10초 광중합**합니다.\n5. Composite를 **조금씩(incrementally)** 넣고 **층마다 20초** 광중합합니다.\n\n'선택적 산부식'은 산을 법랑질에만 바르는 방법입니다. 이 강의에는 10초, 20초, 60초가 모두 나오기 때문에 각 숫자가 어느 단계의 시간인지 짝지어 두어야 합니다.", "why": {"0": "Class V composite 술식의 산부식 시간에 없는 값입니다.", "1": "10초는 Scotchbond Universal Plus의 광중합 시간, 그리고 GC Cavity Conditioner 도포 시간입니다.", "2": "'Etch enamel for 20 seconds'입니다. 정답입니다.", "3": "60초는 Consepsis 도포 시간입니다."}, "one": "Class V composite: 법랑질 선택적 산부식 20초 → Consepsis 60초 → SBU+ 2겹 20초 → 광중합 10초.", "src": "Cl V 2026.pdf, p.34, 35, 37, 52", "nota": false}, "62": {"id": 62, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "During composite placement in a Class V restoration, which is correct?", "o": ["Bulk fill in one increment and cure for 20 seconds", "Place incrementally, cure each increment for 20 seconds, and fill exactly flush without excess", "Place incrementally, cure each increment for 10 seconds, and slightly underfill the prep", "Place incrementally, cure each increment for 20 seconds, and slightly overfill the prep"], "a": 3, "qk": "5급 composite 충전 단계에 대한 설명으로 옳은 것은?", "ok": ["한 번에 bulk fill하고 20초 광중합한다", "조금씩 넣고, 층마다 20초 광중합하며, 잉여분 없이 딱 맞게 채운다", "조금씩 넣고, 층마다 10초 광중합하며, 와동을 약간 덜 채운다", "조금씩 넣고, 층마다 20초 광중합하며, 와동을 약간 넘치게 채운다"], "exp": "Class V composite 충전(Placement)의 세 가지 원칙은 다음과 같습니다.\n\n1. **조금씩 넣기(Place composite incrementally)**\n2. **층마다 20초 광중합(Cure each increment for 20 secs)**\n3. **와동을 약간 넘치게 채우기(Slightly overfill the prep)**\n\n약간 넘치게 채우는 이유는 그 다음 단계와 연결됩니다. 넘친 잉여분(gross excess)은 finishing bur로 제거하면서 외형을 만들고, 변연은 Sof-Lex disc로 마무리합니다.\n\n오답 보기의 bulk fill은 Fuji II LC를 와동 전체에 한 번에 넣을 때(bulk fill) 쓰는 표현이니 재료별로 구분하세요.", "why": {"0": "Class V composite는 조금씩(incrementally) 넣습니다. 한 번에 채우는 bulk fill은 Fuji II LC(RMGI) 단계에서 나오는 방법입니다.", "1": "앞부분은 맞지만, 와동은 약간 넘치게 채운 뒤 finishing bur로 잉여분을 제거하고 형태를 만듭니다.", "2": "층마다의 광중합은 20초이고, 와동은 약간 '넘치게(overfill)' 채웁니다. 10초는 접착제의 광중합 시간입니다.", "3": "'Place composite incrementally, Cure each increment for 20 secs, Slightly overfill the prep'입니다. 정답입니다."}, "one": "Class V composite = incremental + 층마다 20초 + 약간 overfill.", "src": "Cl V 2026.pdf, p.36, 37, 40, 53", "nota": false}, "63": {"id": 63, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "With a universal (“8th generation”) adhesive such as Scotchbond Universal, 'selective etch' means:", "o": ["Applying etch to the enamel only", "Applying etch to the entire tooth", "Letting the adhesive etch the dentin", "Applying etch to the dentin only"], "a": 0, "qk": "Scotchbond Universal 같은 universal('8세대') 접착제에서 '선택적 산부식(selective etch)'은 무엇을 뜻하는가?", "ok": ["법랑질에만 산부식제를 바름", "치아 전체에 산부식제를 바름", "접착제가 상아질을 부식하게 둠", "상아질에만 산부식제를 바름"], "exp": "**'8세대(8th Generation)'**는 그 자체로 새로운 분류입니다. 대표 제품은 **Scotchbond Universal(3M)**이고, 세 가지 방법으로 쓸 수 있습니다.\n\n1. **Total Etch**: 치아 전체에 산부식제를 바릅니다.\n2. **Selective Etch**: **법랑질에만** 산부식제를 바릅니다.\n3. **Self Etch**: 접착제가 상아질을 부식하게 둡니다.\n\nClass V composite 술식에서 '법랑질 20초 selective etch'를 했던 것이 바로 이 selective etch입니다. 그때 상아질은 촉촉하게(wet dentin) 유지했습니다. 오답 '상아질에만'은 selective etch의 대상(법랑질)을 정반대로 바꾼 함정입니다.", "why": {"0": "'Selective Etch (apply etch to only enamel)'입니다. 정답입니다.", "1": "이것은 total etch입니다.", "2": "이것은 self etch입니다.", "3": "세 가지 사용법(total, selective, self etch) 중 어디에도 없는 방법입니다. Selective etch는 '법랑질'에만 바르는 것입니다."}, "one": "Universal: Total = 전체, Selective = 법랑질만, Self = 접착제가 상아질 부식.", "src": "Fillings - Composite, GI.pdf, p.26 / Cl V 2026.pdf, p.34", "nota": false}, "64": {"id": 64, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Amalgam is the oldest dental filling material still in use.", "o": ["True", "False"], "a": 0, "qk": "아말감은 현재도 사용되는 가장 오래된 치과 충전 재료이다.", "ok": ["참(True)", "거짓(False)"], "exp": "아말감의 역사(History)를 정리하면 다음과 같습니다.\n\n- 서기 650년 중국에서 처음 사용되었습니다.\n- 1528년 독일에서 충전 재료로 권장되었습니다.\n- 1890년대 후반에 보편적으로 받아들여졌고, G. V. Black이 아말감을 현대로 발전시켰습니다.\n\n핵심 포인트(Key point)는 **아말감이 지금도 쓰이는 가장 오래된 치과 충전 재료(oldest dental filling material still used)**라는 것입니다. 다른 어떤 재료도 이만큼 긴 사용 실적(track record)이 없습니다. 그래서 '사람들이 아말감이 나쁘다고 말할 때 이 점을 기억하라'고 강조됩니다.", "why": {"1": "False를 고르면 아말감보다 오래된 현용 충전 재료가 있다는 뜻인데, 아말감이 'Oldest dental filling material still used'이므로 틀립니다."}, "one": "아말감 = 현용 최고(最古) 충전 재료, 가장 긴 track record.", "src": "Fillings - Amalgam.pdf, p.3", "nota": false}, "65": {"id": 65, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Which amalgam component reduces corrosion?", "o": ["Tin", "Indium/Palladium", "Zinc", "None of the above"], "a": 1, "qk": "부식을 줄이는 아말감 성분은?", "ok": ["주석(Tin)", "인듐/팔라듐(Indium/Palladium)", "아연(Zinc)", "위의 어느 것도 아니다"], "exp": "**인듐/팔라듐(Indium/Palladium)**은 아말감 합금 가루에서 가장 적은 성분이고, 역할은 **부식을 줄이는 것(reduces corrosion)**입니다.\n\n부식과 관련된 내용을 한데 모아 보면 다음과 같습니다.\n- γ2(Sn-Hg)는 가장 불안정하고, 가장 약하며, **부식되기 쉬운(corrosive)** 상입니다.\n- 수은 함량이 너무 적으면 건조하고 알갱이진 혼합물이 되어, 거칠고 패인 표면이 생기고 부식을 촉진합니다.\n- 잘 연마된 아말감은 변색과 부식을 줄입니다.\n- 인듐/팔라듐은 부식을 줄입니다.", "why": {"0": "주석은 수은과 결합하여 γ2를 만듭니다(γ2는 부식되기 쉬운 상). 부식을 줄이는 역할로 제시되지 않았습니다.", "1": "'Indium/Palladium – Reduces corrosion'입니다. 정답입니다.", "2": "아연은 산화물 제거제이고 지연 팽창을 일으킵니다. 부식 감소는 인듐/팔라듐의 역할입니다.", "3": "인듐/팔라듐이 보기에 있으므로 틀립니다."}, "one": "In/Pd = 부식 감소(가장 적은 성분).", "src": "Fillings - Amalgam.pdf, p.10, 17, 21, 27, 37", "nota": true}, "66": {"id": 66, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Why should amalgam be condensed incrementally while the surface is still shiny?", "o": ["Shiny means the zinc has finished scavenging the oxides from the alloy", "Shiny means there is sufficient mercury to allow the layers to attach to each other", "Shiny means the amalgam has fully set and is ready to be polished under water", "None of the above"], "a": 1, "qk": "아말감을 표면이 아직 반짝일 때 조금씩 응축해야 하는 이유는?", "ok": ["반짝인다는 것은 아연이 합금의 산화물 제거를 끝냈다는 뜻이기 때문", "반짝인다는 것은 층끼리 붙을 만큼 수은이 충분하다는 뜻이기 때문", "반짝인다는 것은 완전히 굳어 물을 쓰며 연마할 준비가 되었다는 뜻이기 때문", "위의 어느 것도 아니다"], "exp": "아말감 충전 요령은 다음과 같습니다.\n\n- **표면이 아직 반짝일 때 조금씩 응축합니다(condense incrementally while surface is still shiny).**\n- **반짝인다는 것은 층끼리 서로 붙을 만큼 수은이 충분하다는 뜻입니다.**\n- 수은이 풍부한 마지막 층의 표면은 조각하여 제거합니다.\n- 새 혼합물은 이전 혼합물이 가소성(plasticity)을 잃기 전에 추가합니다.\n- 연마는 24시간 후에 하고, 과열을 피하려고 물을 씁니다.\n\n즉 '반짝임 = 수은이 남아 있음 = 다음 층이 붙을 수 있음'입니다.", "why": {"0": "아연이 산화물 제거제인 것은 맞지만, 응축할 때의 반짝임과는 관계가 없습니다.", "1": "'Shiny means there is sufficient mercury to allow layers to attach to each other'입니다. 정답입니다.", "2": "연마는 충전 24시간 후에 합니다. 반짝임은 경화 완료의 신호가 아닙니다.", "3": "첫 번째 보기가 정답이므로 틀립니다."}, "one": "반짝일 때 응축 = 수은 충분 → 층끼리 결합.", "src": "Fillings - Amalgam.pdf, p.16, 38, 39", "nota": true}, "67": {"id": 67, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "A composite with more resin matrix and less filler has a higher elastic modulus.", "o": ["True", "False"], "a": 1, "qk": "레진 기질이 많고 필러가 적은 composite는 탄성계수(elastic modulus)가 더 높다.", "ok": ["참(True)", "거짓(False)"], "exp": "레진 기질이 많고 필러가 적은 composite(More resin matrix & Less filler particles)는 다음과 같은 성질을 보입니다.\n\n- 중합 수축이 더 큽니다(greater polymerization shrinkage).\n- 수분 흡수가 더 많습니다(greater water sorption).\n- 압축 강도와 굴곡 강도가 더 낮습니다(less compressive & flexural strength).\n- **탄성계수가 더 낮습니다(lower elastic modulus).**\n\n즉, 레진이 많아지면 수축과 수분 흡수는 '더(greater)', 강도와 탄성계수는 '덜(less/lower)' 쪽으로 갑니다. 문제는 탄성계수가 더 높다고 했으므로 거짓입니다. 반대로 필러는 기계적 성질을 높이고 중합 수축을 줄이는 역할을 합니다.", "why": {"0": "True를 고르면 레진이 많을 때 탄성계수가 높아진다고 보는 것인데, 레진이 많고 필러가 적으면 탄성계수는 '낮아집니다(lower elastic modulus)'."}, "one": "레진↑ 필러↓ → 수축↑ 수분흡수↑ / 강도↓ 탄성계수↓.", "src": "Fillings - Composite, GI.pdf, p.9", "nota": false}, "68": {"id": 68, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "A higher C-factor produces less polymerization shrinkage stress on the preparation wall.", "o": ["True", "False"], "a": 1, "qk": "C-factor가 높을수록 와동벽에 걸리는 중합 수축 응력이 작아진다.", "ok": ["참(True)", "거짓(False)"], "exp": "**C-factor(형태 계수, configuration factor)**는 '결합된 면(bonded surfaces) 대 결합되지 않은 면(unbonded surfaces)의 비율'입니다.\n\n결합된 면이 많을수록, 즉 **C-factor가 높을수록 와동벽에 걸리는 중합 수축 응력이 커집니다(higher C-factor: more polymerization shrinkage stress on preparation wall).**\n\n이 응력을 줄이는 방법이 **composite를 조금씩 넣고 중합하는 것(incremental addition and polymerization)**입니다. Class 2 예시 그림에서는 층마다 C-factor 값이 다르게 표시되어 있습니다(1번 층 2, 2번 층 1.5).\n\n문제는 '작아진다'고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 높은 C-factor가 응력을 줄인다고 보는 것인데, 실제로는 C-factor가 높을수록 와동벽의 중합 수축 응력이 커집니다."}, "one": "C-factor = 결합면/비결합면, 높을수록 수축 응력↑ → incremental 충전으로 줄임.", "src": "Fillings - Composite, GI.pdf, p.18", "nota": false}, "69": {"id": 69, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In finishing a Class V composite, which instrument is used to FINALIZE the anatomy?", "o": ["H274", "7404", "#201.3
