diamond", "Jiffy brush"], "a": 0, "qk": "5급 composite 마무리에서 해부학적 형태를 '최종 마무리(finalize)'하는 데 쓰는 것은?", "ok": ["H274", "7404", "#201.3 diamond", "Jiffy brush"], "exp": "Class V composite 마무리와 연마(Finishing & polishing)는 순서가 있습니다.\n\n1. **finishing bur(7404, 7901)**로 잉여분을 제거하고 해부학적 형태를 만든 뒤, **H274로 해부학적 형태를 최종 마무리**합니다.\n2. **파란색과 회색 polishing cup**으로 연마합니다.\n3. **Jiffy brush**로 최종 광택(final luster)을 냅니다.\n\n그 밖에 변연은 coarse, medium grit Sof-Lex disc로 마무리하고, 필요하면 치은 쪽 잉여분은 Bard-Parker #12 blade로 제거합니다. 형태를 만들 때는 기존 외형을 따르고 평평하게 하지 말며(Do not flatten!), explorer로 변연을 확인합니다.\n\n'shape'(7404, 7901)와 'finalize'(H274)를 구분하는 것이 이 문제의 포인트입니다.", "why": {"0": "'finalize anatomy with H274'입니다. 정답입니다.", "1": "7404(와 7901)는 잉여분을 제거하고 해부학적 형태를 만드는(finish excess and shape anatomy) finishing bur입니다. 최종 마무리는 H274입니다.", "2": "#201.3은 충전 전에 법랑질에 베벨을 주는 bur입니다.", "3": "Jiffy brush는 마지막 광택(final luster)을 내는 데 씁니다. 해부학적 형태를 만드는 단계가 아닙니다."}, "one": "Shape = 7404/7901, Finalize = H274, Polish = 파란/회색 cup, Final luster = Jiffy brush.", "src": "Cl V 2026.pdf, p.39, 41, 42", "nota": false}, "70": {"id": 70, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "Failure to prevent and treat NCCLs can result in the need for endodontic therapy.", "o": ["True", "False"], "a": 0, "qk": "NCCL(비우식성 치경부 병소)을 예방하고 치료하지 않으면 근관치료(endodontic therapy)가 필요해질 수 있다.", "ok": ["참(True)", "거짓(False)"], "exp": "NCCL은 우식이 아니라고 해서 그냥 두면 되는 병소가 아닙니다. **NCCL을 예방하고 치료하지 않으면(failure to prevent and treat NCCLs)** 다음과 같은 결과가 생깁니다.\n\n- 치질의 진행성 소실(progressive loss of tooth structure)\n- 치아 과민(tooth sensitivity)\n- **근관치료의 필요(the need for endodontic therapy)**\n- 치아 상실(tooth loss)\n- 추가 병소 발생(occurrence of additional lesions)\n\n이 목록은 바로 앞의 '언제 NCCL을 치료하는가(AOD 권고)'와 짝을 이루니 함께 기억하세요.", "why": {"1": "False를 고르면 NCCL 방치가 근관치료와 무관하다는 뜻이 되는데, 'The need for endodontic therapy'가 방치의 결과 목록에 포함되어 있으므로 틀립니다."}, "one": "NCCL 방치 → 치질 소실, 과민, 근관치료, 치아 상실, 추가 병소.", "src": "Cl V 2026.pdf, p.9", "nota": false}, "71": {"id": 71, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "In a chemically activated (self-cure) composite, the INITIATOR is:", "o": ["Camphorquinone", "Tertiary amine (N,N-dimethyl-p-toluidine)", "Dimethylaminoethyl methacrylate (DMAEMA)", "Benzoyl peroxide"], "a": 3, "qk": "화학 중합형(self-cure) composite에서 개시제(initiator)는 무엇인가?", "ok": ["캄포퀴논(Camphorquinone)", "3차 아민(N,N-dimethyl-p-toluidine)", "DMAEMA (Dimethylaminoethyl methacrylate)", "벤조일 퍼옥사이드(Benzoyl peroxide)"], "exp": "중합(curing)에는 두 가지 성분이 필요합니다. **활성제(Activator)**는 개시제를 촉발하고(열, 빛, 두 페이스트를 섞는 화학 반응), **개시제(Initiator)**는 재료의 경화를 시작합니다.\n\n**화학 중합형(Self-Cure)** — 두 페이스트\n- 활성제: **3차 아민(tertiary amine, N,N-dimethyl-p-toluidine)**\n- 개시제: **벤조일 퍼옥사이드(benzoyl peroxide)**\n- 아민 + 벤조일 퍼옥사이드 → 자유 라디칼 → 경화 시작\n\n**광중합형(Light-Cure)** — 한 페이스트\n- 광감작제(활성제): **캄포퀴논(camphorquinone)**\n- 개시제: **DMAEMA**\n- 빛을 받으면 캄포퀴논이 DMAEMA를 활성화 → 자유 라디칼 → 경화 시작\n\n오답 보기는 모두 실제 composite 중합 성분이지만, '어느 방식의' '어느 역할'인지가 다릅니다. 2×2 표로 외워 두면 헷갈리지 않습니다.", "why": {"0": "캄포퀴논은 광중합형(light-cure)의 광감작제, 즉 활성제(activator)입니다.", "1": "3차 아민은 self-cure의 '활성제(activator)'입니다. 개시제가 아닙니다.", "2": "DMAEMA는 광중합형(light-cure) composite의 개시제입니다. self-cure의 개시제가 아닙니다.", "3": "Self-cure의 한 페이스트에 들어 있는 개시제입니다. 정답입니다."}, "one": "Self-cure: 아민(활성제) + 벤조일 퍼옥사이드(개시제) / Light-cure: 캄포퀴논(활성제) + DMAEMA(개시제).", "src": "Fillings - Composite, GI.pdf, p.14, 15, 16", "nota": false}, "72": {"id": 72, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "For a Class V composite, shade selection should be done after rubber dam isolation because teeth become lighter in color when dry.", "o": ["True", "False"], "a": 1, "qk": "5급 composite 수복에서 치아는 건조되면 색이 밝아지므로, 색조 선택(shade selection)은 러버댐 격리 후에 해야 한다.", "ok": ["참(True)", "거짓(False)"], "exp": "이 문제는 '이유'는 맞게 써 놓고 '순서'를 뒤집은 함정 문제입니다.\n\n**치아는 건조되면 색이 더 밝아집니다(teeth lighter in color when dry).** 러버댐을 걸어 격리하면 치아가 마르기 시작하므로, 그 상태에서 색을 고르면 실제보다 밝은 shade를 고르게 됩니다. 그래서 색조 선택은 **격리 전에(select prior to isolation)** 해야 합니다.\n\nComposite의 술식 순서도 이 원칙과 맞습니다. 순서는 색조 선택(Shade selection) → 격리(Isolation) → 와동 형성/세척 후 살짝 건조(Preparation/Rinse & gently dry) → 산부식·세척·건조·Consepsis·접착제(Etch, rinse, dry, Consepsis, Adhesive) → composite 충전(placement) → 마무리/형태 만들기(Finishing/shaping) → 연마(Polishing)입니다. 색조 선택이 맨 처음입니다.\n\n그 밖에 제조사 shade guide를 가능하면 사용하고, 치은 쪽(gingival) 색은 더 어두운 경향이 있다는 점도 함께 기억하세요.", "why": {"0": "True를 고르면 격리 후에 색을 고르는 것인데, 건조된 치아는 밝아 보이므로 shade는 격리 '전에' 골라야 합니다. 이유는 맞지만 순서가 틀린 문장입니다."}, "one": "Shade는 격리 '전'에! 마른 치아는 밝아 보인다.", "src": "Cl V 2026.pdf, p.31, 32", "nota": false}, "73": {"id": 73, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Silver in amalgam increases flow and creep.", "o": ["True", "False"], "a": 1, "qk": "아말감의 은(silver)은 흐름(flow)과 크리프(creep)를 증가시킨다.", "ok": ["참(True)", "거짓(False)"], "exp": "**은(Silver)**은 아말감의 가장 큰 성분이고, 역할은 다음과 같습니다.\n\n- 아말감의 대부분을 차지합니다(makes up majority).\n- 강도를 줍니다(provides strength).\n- **흐름과 크리프를 줄입니다(decreases flow and creep).**\n- 경화 시 팽창을 늘립니다(increases expansion on setting).\n\n반대로 **주석(Tin)**은 팽창을 줄이고, 강도를 낮추고, **흐름을 늘립니다(increases flow).** 은과 주석은 여러 성질에서 서로 반대 방향으로 작용하므로 함께 비교해 외우면 좋습니다.\n\n문제는 은이 흐름과 크리프를 '증가'시킨다고 했으므로 거짓입니다.", "why": {"0": "True를 고르면 은이 흐름·크리프를 늘린다고 보는 것인데, 은은 흐름과 크리프를 '줄이고', 흐름을 늘리는 것은 주석입니다."}, "one": "Silver: 강도↑ 흐름·크리프↓ 팽창↑ / Tin: 팽창↓ 강도↓ 흐름↑.", "src": "Fillings - Amalgam.pdf, p.11, 12", "nota": false}, "74": {"id": 74, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Loss of the coupling agent releases filler particles, leading to surface breakdown of the composite.", "o": ["True", "False"], "a": 0, "qk": "결합제(coupling agent)가 소실되면 필러 입자가 떨어져 나와 composite 표면이 붕괴된다.", "ok": ["참(True)", "거짓(False)"], "exp": "**결합제(Coupling Agent)**는 composite의 세 번째 성분으로, '접착제(glue)'라고도 표현됩니다. 역할은 다음과 같습니다.\n\n- 필러 입자를 코팅합니다(coats the filler particles).\n- 필러 입자를 레진 기질에 결합시킵니다(binds filler particles to the resin matrix).\n- composite resin의 내구성에 영향을 줍니다(affects the durability).\n- **결합이 없어지면 필러 입자가 풀려나와 표면이 붕괴됩니다(loss of the coupling releases filler particles leading to surface breakdown).**\n\n결합제의 예(adhesive monomers)로는 HEMA, 4-META, MDP가 있습니다. 문제의 문장은 그대로 맞습니다.", "why": {"1": "False를 고르면 결합제 소실이 표면과 무관하다는 뜻인데, 결합이 없어지면 필러가 빠져나가 표면이 붕괴되므로 틀립니다."}, "one": "Coupling agent = 필러와 레진을 묶는 접착제, 없어지면 필러가 빠져 표면 붕괴.", "src": "Fillings - Composite, GI.pdf, p.7, 13", "nota": false}, "75": {"id": 75, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In a Class V preparation, the axial wall must extend at least how far into dentin?", "o": ["0.75 mm", "0.25 mm", "1.25 mm", "0.5 mm"], "a": 3, "qk": "5급 와동에서 축벽은 상아질 안으로 최소 얼마나 들어가야 하는가?", "ok": ["0.75 mm", "0.25 mm", "1.25 mm", "0.5 mm"], "exp": "Class V 축벽 깊이에는 두 종류의 숫자가 있습니다. 하나는 치아 외면에서부터 잰 '전체 깊이'이고, 다른 하나는 '상아질 안으로 들어간 깊이'입니다.\n\n- 전체 깊이: 교합측 1.25–1.50 mm, 치은측 1–1.25 mm, 치근 와동 0.75 mm\n- 상아질 안으로: **0.5 mm** (has to be 0.5 mm in dentin)\n\n아말감으로 Class V를 할 때도 축벽 깊이는 **상아질 안으로 약 0.5 mm(about 0.5 mm into dentin)**입니다. 즉, 재료가 composite든 amalgam이든 '상아질 내 0.5 mm'는 공통입니다. 0.25 mm(1/4 mm)는 아말감 유지구 깊이이니 혼동하지 마세요.", "why": {"0": "0.75 mm는 와동이 치근(root)에 있을 때의 축벽 전체 깊이입니다.", "1": "약 1/4 mm는 아말감 Class V 유지구(retention groove)의 깊이입니다. 상아질 내 축벽 깊이가 아닙니다.", "2": "1.25 mm는 치은측벽 쪽 축벽 깊이의 상한, 또는 교합측 깊이의 하한입니다. 상아질 내 깊이가 아닙니다.", "3": "'has to be 0.5mm in dentin', 그리고 아말감 Class V에서도 'axial wall depth about 0.5mm into dentin'입니다. 정답입니다."}, "one": "Class V 축벽은 상아질 안으로 0.5 mm (composite·amalgam 공통).", "src": "Cl V 2026.pdf, p.13, 64, 66", "nota": false}, "76": {"id": 76, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "Which method is described as IDEAL for moisture control in a Class V amalgam restoration?", "o": ["Gingival retraction cord", "Rubber dam with a #212 clamp", "Electrosurgery", "Periodontal flap"], "a": 1, "qk": "5급 아말감 수복에서 '이상적인(ideal)' 방습 방법으로 제시된 것은?", "ok": ["치은 압배사(Gingival retraction cord)", "#212 클램프를 건 러버댐", "전기수술(Electrosurgery)", "치주 판막(Periodontal flap)"], "exp": "Class V는 잇몸 바로 옆에 있어서 방습(moisture control)이 어렵습니다. 그래서 강의 시작부터 **러버댐과 #212 클램프(Start with Rubber Dam, Clamp 212)**를 강조합니다. #212 클램프에는 'Gingival' 쪽과 'Incisal' 쪽이 표시되어 있습니다.\n\n아말감 Class V의 방습은 다음과 같이 정리됩니다.\n- **이상적(ideal)**: #212 클램프를 건 러버댐\n- **대안(alternative methods)**: 치은 압배사(gingival retraction cord), 전기수술(electrosurgery), 치주 판막(periodontal flap)\n\n오답 보기 세 개는 모두 실제로 쓰는 방법이지만 '대안'입니다. 문제에서 'ideal'이라는 단어를 놓치면 틀리기 쉽습니다. 참고로 러버댐을 쓰지 않을 때는 충전 전에 압배사로 치은 조직을 젖혀 둡니다.", "why": {"0": "압배사는 '대안적인 방습 방법(alternative methods)' 중 하나입니다. 이상적인 방법이 아닙니다.", "1": "'Rubber dam with #212 is ideal'입니다. 정답입니다.", "2": "전기수술도 '대안적인 방습 방법' 중 하나입니다.", "3": "치주 판막도 '대안적인 방습 방법' 중 하나입니다."}, "one": "Class V 방습: 이상적 = 러버댐 + #212, 대안 = 압배사·전기수술·치주 판막.", "src": "Cl V 2026.pdf, p.19, 63, 67", "nota": false}, "77": {"id": 77, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Among the toxic effects of mercury, 'formication' refers to:", "o": ["Skin discoloration and pruritus (itching)", "Muscle weakness", "Sensation of insects crawling on skin", "None of the above"], "a": 2, "qk": "수은의 독성 증상 중 '개미주행감(formication)'은 무엇을 뜻하는가?", "ok": ["피부 변색과 가려움(pruritus)", "근력 약화", "피부 위로 벌레가 기어가는 느낌", "위의 어느 것도 아니다"], "exp": "수은은 생체 조직에 손상을 일으킵니다(mercury causes injury to biological tissues). 독성(Toxicity) 증상은 다음과 같습니다.\n\n- **근긴장저하(Hypotonia)**: 근력 약화\n- **말단동통증(Acrodynia)**: 피부 변색과 가려움(pruritus)\n- **말초 신경병증(Peripheral neuropathy)**\n  - 감각 이상(Paresthesia)\n  - **개미주행감(Formication)**: 피부 위로 벌레가 기어가는 느낌\n- 신장 기능 이상(Kidney dysfunction)\n- 신경정신 증상(Neuropsychiatric symptoms): 감정 불안정, 기억 상실, 불면\n\n다만 같은 강의에서 '치과용 아말감에 의한 수은 노출은 건강에 영향을 주지 않는다(no health effect)'고 정리한다는 점도 함께 기억하세요.", "why": {"0": "피부 변색과 가려움(pruritus)은 말단동통증(acrodynia)입니다.", "1": "근력 약화는 근긴장저하(hypotonia)입니다.", "2": "'Formication: sensation of insects crawling on skin'입니다. 정답입니다.", "3": "첫 번째 보기가 정답이므로 틀립니다."}, "one": "Formication = 벌레 기어가는 느낌(말초 신경병증), Hypotonia = 근력 약화, Acrodynia = 변색·가려움.", "src": "Fillings - Amalgam.pdf, p.7, 8", "nota": true}, "78": {"id": 78, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "How is Scotchbond Universal Plus applied in the Class V composite protocol?", "o": ["One layer applied for 10 seconds, air-thinned, then light cured for 20 seconds", "Two layers applied for 10 seconds, air-thinned, then light cured for 20 seconds", "Two layers for 20 seconds, thinned, then light cured for 10 seconds", "None of the above"], "a": 2, "qk": "5급 composite 술식에서 Scotchbond Universal Plus는 어떻게 적용하는가?", "ok": ["1겹을 10초간 바르고 공기로 얇게 편 뒤 20초 광중합", "2겹을 10초간 바르고 공기로 얇게 편 뒤 20초 광중합", "2겹을 20초간 바르고 얇게 편 뒤 10초 광중합", "위의 어느 것도 아니다"], "exp": "접착제 단계의 숫자는 '2 · 20 · 10'으로 외우면 편합니다.\n\n- **2** layers (2겹)\n- **20** seconds (20초 도포, 문질러 바르기)\n- 얇게 펴기(thin it)\n- **10** seconds 광중합(Light Cure 10 sec)\n\n이 단계는 Consepsis를 60초 바르고 약한 바람으로 5초 건조한 다음에 합니다. 그리고 그 뒤 composite를 조금씩 넣으며 **층마다 20초** 광중합합니다. 오답 보기들은 접착제의 10초와 composite의 20초를 서로 바꿔 놓은 것입니다.", "why": {"0": "겹수(1겹), 도포 시간(10초), 광중합 시간(20초)이 모두 바뀌어 있습니다. 20초 광중합은 composite 층마다의 광중합 시간입니다.", "1": "겹수는 맞지만 도포 시간과 광중합 시간이 서로 바뀌어 있습니다.", "2": "'Apply Scotchbond Universal Plus (2 layers) 20 Sec, thin it, Light Cure 10 sec'입니다. 정답입니다.", "3": "첫 번째 보기가 정확한 방법이므로 틀립니다."}, "one": "Scotchbond Universal Plus = 2겹 · 20초 · thin · 10초 광중합.", "src": "Cl V 2026.pdf, p.35, 37", "nota": true}, "79": {"id": 79, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "6th generation (two-step self-etching) bonding systems are more prone to hydrolytic degradation.", "o": ["True", "False"], "a": 0, "qk": "6세대(2단계 자가부식) 접착 시스템은 가수분해성 분해(hydrolytic degradation)에 더 취약하다.", "ok": ["참(True)", "거짓(False)"], "exp": "**6세대(6th Generation) – 2단계 자가부식(Two Step Self-Etching)** 시스템의 특징은 다음과 같습니다.\n\n- **낮은 pH의 primer가 치아를 부식시킵니다(low pH primer etches tooth).** 따로 인산 산부식을 하지 않습니다.\n- **가수분해성 분해에 더 취약합니다(more prone to hydrolytic degradation).**\n- 두 단계: ① 자가부식 primer 도포 → ② adhesive 도포 후 중합\n- 예: Clearfil SE(Kuraray), All Bond SE(Bisco)\n\n세대별로 정리하면 4세대는 3단계 etch & rinse(gold standard), 5세대는 2단계 etch & rinse(primer와 adhesive를 하나로), 6세대는 2단계 self-etch, 7세대는 1단계 self-etch, '8세대'는 universal(total, selective, self etch 모두 가능)입니다.", "why": {"1": "False를 고르면 6세대가 가수분해에 취약하지 않다는 뜻인데, 'More prone to hydrolytic degradation'이 6세대의 특징으로 제시되어 있으므로 틀립니다."}, "one": "6세대 = 2단계 self-etch, 낮은 pH primer, 가수분해에 취약.", "src": "Fillings - Composite, GI.pdf, p.21, 22, 23, 24, 25, 26", "nota": false}, "80": {"id": 80, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Delayed expansion of amalgam can result when:", "o": ["A zinc-containing amalgam is contaminated by moisture", "A zinc-free amalgam is overtriturated", "The mercury content of the mix is too low", "A copper-containing amalgam is contaminated by moisture"], "a": 0, "qk": "아말감의 지연 팽창(delayed expansion)은 어떤 경우에 생길 수 있는가?", "ok": ["아연이 들어 있는 아말감이 수분에 오염되었을 때", "아연이 없는 아말감을 과다 혼합했을 때", "혼합물의 수은 함량이 너무 낮을 때", "구리가 들어 있는 아말감이 수분에 오염되었을 때"], "exp": "**지연 팽창(delayed expansion)**은 **아연(Zinc)**과 **수분(moisture)** 두 가지가 만나야 생깁니다.\n\n- 아연의 역할: 산화물 제거제, 그리고 **지연 팽창을 일으킴**. 이 효과를 줄이려고 아연이 없는 합금(zinc free alloys)도 있습니다.\n- 치수 변화(Dimensional Change): ① 혼합 중 초기 수축 → ② 결정 성장에 의한 팽창. 그리고 **아연이 들어 있는 아말감이 수분에 오염되면 지연 팽창**이 생길 수 있습니다.\n\n오답 보기들은 다른 성분(구리), 반대 상황(아연 없는 합금), 다른 결과를 낳는 요인(수은 부족)으로 바꿔 놓은 것입니다.", "why": {"0": "'If amalgam contains zinc and is contaminated by moisture it can result in delayed expansion'입니다. 정답입니다.", "1": "아연이 없는 합금은 오히려 지연 팽창을 줄이려고 쓰는 것입니다. 과다 혼합은 강도를 낮추는 요인입니다.", "2": "수은 함량이 낮으면 건조하고 알갱이진 혼합물이 되어 거칠고 패인 표면이 생기고 부식을 촉진합니다. 지연 팽창의 원인이 아닙니다.", "3": "지연 팽창의 원인 성분은 구리가 아니라 아연입니다."}, "one": "지연 팽창 = 아연(Zn) + 수분 오염 → zinc-free 합금으로 예방.", "src": "Fillings - Amalgam.pdf, p.16, 26, 27, 30", "nota": false}, "81": {"id": 81, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "For Fuji II LC, after depressing the plunger you place the capsule into the applier and click twice, then after mixing you click once to prime the capsule.", "o": ["True", "False"], "a": 1, "qk": "Fuji II LC에서 플런저를 누른 뒤 캡슐을 applier에 넣고 두 번 클릭하고, 혼합 후에는 한 번 클릭하여 캡슐을 prime한다.", "ok": ["참(True)", "거짓(False)"], "exp": "Fuji II LC(RMGI) 캡슐 사용 순서는 '한 번 → 두 번'입니다. 순서대로 따라가 봅시다.\n\n1. GC Cavity Conditioner(폴리아크릴산, polyacrylic acid)를 10초 도포합니다.\n2. 컨디셔너가 없어질 때까지 물로 충분히 헹굽니다.\n3. 캡슐을 흔들어 가루를 풀어 줍니다(shake the capsule to loosen powder).\n4. **플런저를 누르고(depress plunger), applier에 넣어 한 번 클릭합니다(click once).** 이것이 활성화(activation) 단계입니다.\n5. 10초간 혼합합니다(mix for 10 sec).\n6. **Fuji II LC를 다시 applier에 넣고 두 번 클릭하여 캡슐을 prime한 뒤(click twice to prime capsule)** 천천히 주입합니다.\n7. 와동 전체에 넣고(bulk fill) 형태를 만듭니다.\n8. 20초 광중합합니다.\n9. 물 분무 하에서 마무리·연마합니다.\n10. GC Fuji II LC Coat를 바르고 10초 광중합합니다.\n\n문제는 '두 번 → 한 번'으로 순서를 뒤집었으므로 거짓입니다. **활성화 = 1번 클릭, prime = 2번 클릭**으로 기억하세요.", "why": {"0": "True를 고르면 활성화 때 두 번, prime 때 한 번 클릭한다고 보는 것인데, 실제로는 활성화 때 한 번(click once), prime 때 두 번(click twice)이므로 틀립니다."}, "one": "Fuji II LC: 플런저 누르고 1번 클릭 → 10초 혼합 → 2번 클릭(prime) → 주입.", "src": "Cl V 2026.pdf, p.52, 53", "nota": false}, "82": {"id": 82, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "The resin matrix is the component of composite that polymerizes and is responsible for polymerization shrinkage.", "o": ["True", "False"], "a": 0, "qk": "레진 기질(resin matrix)은 composite에서 중합되는 성분이며 중합 수축의 원인이 된다.", "ok": ["참(True)", "거짓(False)"], "exp": "Composite resin은 세 가지 성분으로 이루어집니다. **레진 기질(Resin Matrix)**, **필러(Filler)**, **결합제(Coupling Agent, '접착제/glue')**입니다.\n\n레진 기질의 대표 성분은 bis-GMA, UDMA, TEGDMA이고, 역할은 다음과 같습니다.\n- 모든 성분을 하나로 묶어 줍니다(holds all components together).\n- **중합되는 성분**입니다(component that polymerizes).\n- **composite 수축의 원인**입니다(responsible for shrinkage of composite).\n- 색소를 받아들여 A1, A2 같은 다양한 shade를 만듭니다(accepts pigments).\n\n그래서 레진 기질이 많고 필러가 적을수록 중합 수축이 커집니다. 문제의 문장은 맞습니다.", "why": {"1": "False를 고르면 수축이 다른 성분 때문이라고 보는 것인데, 중합하고 수축하는 성분은 레진 기질이고, 필러는 오히려 중합 수축을 줄여 줍니다."}, "one": "레진 기질 = 중합되는 성분 = 수축의 원인 = 색소(shade) 수용.", "src": "Fillings - Composite, GI.pdf, p.6, 8, 9, 11", "nota": false}, "83": {"id": 83, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which of the following is NOT a purpose of filler in composite resin?", "o": ["Increase the coefficient of thermal expansion", "Decrease polymerization shrinkage", "Increase wear resistance", "Control the workability and viscosity of the composite"], "a": 0, "qk": "다음 중 composite resin에서 필러의 목적이 아닌 것은?", "ok": ["열팽창계수 증가", "중합 수축 감소", "내마모성 증가", "composite의 작업성과 점도 조절"], "exp": "필러의 목적(Purpose)은 다섯 가지입니다.\n\n1. 기계적 성질 증가(increase mechanical properties)\n2. 내마모성 증가(increase wear resistance)\n3. **열팽창계수 감소(decrease coefficient of thermal expansion)**\n4. 중합 수축 감소(decrease polymerization shrinkage)\n5. 작업성/점도 조절(controls workability/viscosity)\n\n'증가'하는 것은 기계적 성질과 내마모성, '감소'하는 것은 열팽창계수와 중합 수축입니다. 오답 보기는 열팽창계수의 방향을 뒤집어 놓았습니다.", "why": {"0": "필러는 열팽창계수를 '감소'시킵니다(decrease coefficient of thermal expansion). 그래서 이것이 '아닌 것'입니다.", "1": "필러의 목적입니다.", "2": "필러의 목적입니다.", "3": "필러의 목적입니다."}, "one": "필러: 강도·내마모성↑ / 열팽창계수·중합수축↓ / 점도 조절.", "src": "Fillings - Composite, GI.pdf, p.11", "nota": false}, "84": {"id": 84, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "In the first stage of amalgam dimensional change, expansion occurs as alloy particles dissolve in mercury.", "o": ["True", "False"], "a": 1, "qk": "아말감 치수 변화의 첫 단계에서는 합금 입자가 수은에 녹으면서 팽창이 일어난다.", "ok": ["참(True)", "거짓(False)"], "exp": "아말감의 **치수 변화(Dimensional Change)**는 두 단계입니다.\n\n1. **초기 수축(Initial Contraction)**: 혼합(trituration) 중에 **합금 입자가 수은에 녹으면서** 생깁니다.\n2. **팽창(Expansion)**: **결정 기질(crystal matrix)이 생기고 자라면서** 생깁니다.\n\n그리고 **아연이 들어 있는 아말감이 수분에 오염되면 지연 팽창(delayed expansion)**이 생길 수 있습니다.\n\n문제는 첫 단계를 '팽창'이라고 했습니다. 첫 단계는 수축이고, 팽창은 두 번째 단계(결정 성장)이므로 거짓입니다. '녹으면 줄고(수축), 결정이 자라면 커진다(팽창)'로 기억하세요.", "why": {"0": "True를 고르면 첫 단계가 팽창이라고 보는 것인데, 합금 입자가 수은에 녹는 첫 단계는 '초기 수축'이고 팽창은 결정 성장 단계입니다."}, "one": "치수 변화: ① 녹으면서 초기 수축 → ② 결정 성장으로 팽창 (+ 아연·수분 → 지연 팽창).", "src": "Fillings - Amalgam.pdf, p.30", "nota": false}, "85": {"id": 85, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "After initial access, which burs are used to prepare a conventional Class V cavity?", "o": ["Pear-shaped #245 and #330", "#201.3 diamond and #7404", "#2 round and #1/4 round", "None of the above"], "a": 0, "qk": "초기 접근 후 전통적인 5급 와동을 형성하는 데 쓰는 bur는?", "ok": ["Pear-shaped #245와 #330", "#201.3 diamond와 #7404", "#2 round와 #1/4 round", "위의 어느 것도 아니다"], "exp": "Class V에서 쓰는 bur는 단계별로 정리하면 헷갈리지 않습니다.\n\n1. **초기 접근(initial access)**: #2 round bur (1 mm)\n2. **와동 형성(prep)**: pear-shaped bur **#245, #330**\n3. **법랑질 베벨(composite용)**: #201.3 diamond (0.5 mm, 45°)\n4. **비우식성 병소의 상아질 거칠게 하기**: #330 diamond\n5. **아말감 유지구**: #1/4 round 또는 #37 (1/4 round contra-angle bur, 깊이 약 1/4 mm)\n6. **Composite 마무리**: 7404, 7901로 잉여분 제거와 형태, H274로 해부학적 형태 마무리\n\n오답 보기들은 모두 이 강의에 실제로 나오는 bur 번호이지만 용도가 다릅니다.", "why": {"0": "'Pear-shaped bur #245, 330 for prep'입니다. 정답입니다.", "1": "#201.3은 법랑질 베벨용 diamond이고, 7404는 composite의 잉여분 제거·해부학적 형태를 만드는 finishing bur입니다.", "2": "#2 round는 초기 접근(initial access)용이고, #1/4 round는 아말감 Class V의 유지구(retention)용입니다. 형성용이 아닙니다.", "3": "#245와 #330이 보기 안에 있으므로 틀립니다."}, "one": "Class V 형성 = pear-shaped #245/#330, 초기 접근 = #2 round.", "src": "Cl V 2026.pdf, p.15, 29, 39, 64, 66", "nota": true}, "86": {"id": 86, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which pairing of composite application and example product is correct?", "o": ["Core build-up – Pro-Temp", "Flowable filling (high stress) – Filtek Supreme", "Flowable filling (low stress) – Permaflow", "Packable filling (low stress) – Permaflow"], "a": 2, "qk": "Composite resin의 용도와 제품 예의 짝으로 옳은 것은?", "ok": ["코어 축조 – Pro-Temp", "Flowable 충전(고응력) – Filtek Supreme", "Flowable 충전(저응력) – Permaflow", "Packable 충전(저응력) – Permaflow"], "exp": "Composite resin의 용도(Applications)와 제품 예를 정리하면 다음과 같습니다.\n\n- **충전(Fillings)**\n  - Flowable: **저응력(Low Stress)** – **Permaflow**\n  - Packable: **고응력(High Stress)** – **Filtek Supreme**\n- **코어 축조(Buildups)**: Core Buildup – **Luxacore**\n- **임시 수복(Provisional)**: **Pro-Temp**\n- **간접 수복(Indirect Restorations)**: 밀링한(milled) composite를 접착\n- **시멘트(Cements)**: 레진 시멘트(Resin Cements)\n\n오답 보기들은 '응력 수준'과 '제품명'을 서로 바꿔 놓은 것입니다. Flowable = 저응력 = Permaflow, Packable = 고응력 = Filtek Supreme으로 짝지어 기억하세요.", "why": {"0": "Pro-Temp는 임시 수복(Provisional) 제품 예입니다. 코어 축조 제품 예는 Luxacore입니다.", "1": "Filtek Supreme은 packable(고응력) 제품 예입니다. Flowable은 저응력용입니다.", "2": "'Flowable: Low Stress – Permaflow'입니다. 정답입니다.", "3": "Packable은 고응력(High Stress)용이고, 제품 예는 Filtek Supreme입니다. Permaflow는 flowable입니다."}, "one": "Flowable(저응력) = Permaflow, Packable(고응력) = Filtek Supreme, Core = Luxacore, Provisional = Pro-Temp.", "src": "Fillings - Composite, GI.pdf, p.3", "nota": false}, "87": {"id": 87, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "Which effect is attributed to TIN in amalgam?", "o": ["It acts as a scavenger for oxides", "It increases expansion on setting and provides strength", "It easily combines with mercury to form the γ2 phase", "It increases the hardness and strength of the amalgam"], "a": 2, "qk": "아말감에서 주석(Tin)의 작용으로 옳은 것은?", "ok": ["산화물 제거제 역할을 한다", "경화 시 팽창을 늘리고 강도를 준다", "수은과 쉽게 결합하여 γ2 상을 만든다", "아말감의 경도와 강도를 증가시킨다"], "exp": "**주석(Tin)**의 특징은 다음과 같습니다.\n\n- 두 번째로 많은 성분입니다.\n- **팽창을 줄입니다(reduces expansion).**\n- **강도를 낮춥니다(decreases strength).**\n- **흐름을 늘립니다(increases flow).**\n- **반응 속도를 조절합니다(controls rate of the reaction).**\n- **수은과 쉽게 결합하여 감마-2(γ2) 상을 만듭니다.** γ2는 가장 약한 상(weakest phase)이고 수복 실패로 이어집니다.\n\n오답 보기들은 각각 은(팽창 증가), 구리(경도 증가), 아연(산화물 제거)의 역할입니다. 성분과 역할을 짝짓는 문제는 오답 보기가 모두 '다른 성분의 진짜 역할'이라서 까다롭습니다.", "why": {"0": "산화물 제거제는 아연(Zinc)입니다.", "1": "경화 팽창을 늘리고 강도를 주는 것은 은(Silver)입니다. 주석은 오히려 팽창을 줄이고 강도를 낮춥니다.", "2": "주석은 수은과 쉽게 결합하여 가장 약한 상인 감마-2(γ2)를 만들고, 이것이 수복 실패로 이어집니다. 정답입니다.", "3": "경도를 높이는 것은 구리(Copper)입니다. 주석은 오히려 강도를 낮춥니다."}, "one": "Tin = 팽창↓ 강도↓ 흐름↑ 반응속도 조절 + 수은과 γ2 형성.", "src": "Fillings - Amalgam.pdf, p.11, 12, 13, 16", "nota": false}, "88": {"id": 88, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "High copper amalgam contains approximately how much copper?", "o": ["5%", "50%", "2%", "12%"], "a": 3, "qk": "고구리(high copper) 아말감의 구리 함량은 약 얼마인가?", "ok": ["5%", "50%", "2%", "12%"], "exp": "**구리(Copper)**는 경도와 강도를 높입니다. 구리 함량에 따라 아말감은 두 종류로 나뉩니다.\n\n- **저구리 아말감(Low Copper Amalgam)**: 1963년 이전, **구리 5%**, γ2 상이 더 많음\n- **고구리 아말감(High Copper Amalgam)**: 1970년대 이후, **구리 12%**, γ2 상이 더 적음\n\n고구리 아말감은 저구리 아말감의 나쁜 성질을 극복하기 위해 만들어졌습니다. 구리 함량을 5%에서 12%로 늘린 것입니다. 저구리 아말감의 나쁜 성질은 짧은 작업 시간, 치수 변화 증가, 마무리 어려움, 잔류 수은 증가, 높은 크리프, 낮은 초기 강도입니다.", "why": {"0": "5%는 저구리(low copper) 아말감입니다(1963년 이전).", "1": "구리 함량으로 제시된 값이 아닙니다. 아말감에서 가장 많은 성분은 은입니다.", "2": "구리 함량으로 제시된 값(저구리 5%, 고구리 12%)이 아닙니다.", "3": "'High Copper Amalgam: After 1970’s, 12% Copper'입니다. 정답입니다."}, "one": "구리: 저구리 5%(γ2↑) → 고구리 12%(γ2↓).", "src": "Fillings - Amalgam.pdf, p.13, 14, 15", "nota": false}, "89": {"id": 89, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "Class V lesions are usually found on facial surfaces.", "o": ["True", "False"], "a": 0, "qk": "5급(Class V) 병소는 대개 협측/순측(facial) 면에서 발견된다.", "ok": ["참(True)", "거짓(False)"], "exp": "5급(Class V) 병소는 모든 치아의 **치경부(cervical area)**, 즉 치아와 잇몸이 만나는 부위의 평활면에 생기는 병소입니다. 이 병소는 위치에 따라 세 가지로 나눠 볼 수 있습니다. 치관(crown)에만 있는 경우, 치관과 치근(crown and root)에 걸쳐 있는 경우, 치근(root)에만 있는 경우입니다.\n\n위치를 면(surface)으로 보면 Class V 병소는 **대개 협측/순측면(facial surface)**에 생깁니다. 혀 쪽(lingual)에도 생길 수는 있지만 흔한 것은 facial 쪽입니다. 그래서 '대개 facial 면에 있다'는 문장은 맞는 문장입니다.\n\n이 위치 정보는 나중에 재료 선택과도 연결됩니다. 병소가 치관 안에 있느냐, 치관과 치근에 걸쳐 있느냐, 치근에만 있느냐에 따라 composite, sandwich technique(RMGI + composite), RMGIC 등으로 재료가 달라지기 때문입니다.", "why": {"1": "False를 고르면 'Class V는 facial 면에 흔하지 않다'는 뜻이 되는데, 실제로는 'Usually on facial surfaces'라고 정리되어 있어 틀린 선택입니다."}, "one": "Class V 병소의 위치 = 치관/치관+치근/치근, 면으로는 대개 facial.", "src": "Cl V 2026.pdf, p.10", "nota": false}, "90": {"id": 90, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "In a Class V amalgam preparation, the retention grooves are about how deep?", "o": ["1 mm", "1/4 mm", "0.5 mm", "0.75 mm"], "a": 1, "qk": "5급 아말감 와동에서 유지구(retention groove)의 깊이는 약 얼마인가?", "ok": ["1 mm", "1/4 mm", "0.5 mm", "0.75 mm"], "exp": "Class V 아말감은 **기계적 유지 형태(mechanical retentive features)**와 함께 씁니다. 아말감 Class V 와동 형성은 다음과 같습니다.\n\n- 외형(outline)은 병소가 결정합니다(lesion-determined).\n- 축벽 깊이는 상아질 안으로 약 0.5 mm입니다.\n- 내부 축벽은 외부 곡률에 평행하게 합니다.\n- 모든 외부 벽의 출구각(exit angle)은 90°입니다.\n- **유지구(retention grooves)**는 축-교합(axio-occlusal), 축-치은(axio-gingival) 선각에 1/4 round 콘트라앵글 bur로 만들고, **깊이는 약 1/4 mm**입니다.\n\n보기의 다른 숫자들은 모두 이 강의의 다른 단계에서 나오는 값입니다.", "why": {"0": "1 mm는 초기 접근용 #2 round bur의 크기이고, 법랑질 쪽 깊이 그림에 나오는 값입니다. 유지구 깊이가 아닙니다.", "1": "'Groove depth about 1/4mm'입니다. 정답입니다.", "2": "0.5 mm는 축벽이 상아질 안으로 들어가는 깊이입니다. 유지구 깊이가 아닙니다.", "3": "0.75 mm는 치근 쪽 와동의 축벽 깊이입니다."}, "one": "아말감 유지구: axio-occlusal·axio-gingival, 1/4 round bur, 깊이 약 1/4 mm.", "src": "Cl V 2026.pdf, p.14, 15, 64, 65, 66", "nota": false}, "91": {"id": 91, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "tf", "q": "Tarnish of amalgam does not cause the restoration to fail.", "o": ["True", "False"], "a": 0, "qk": "아말감의 변색(tarnish)은 수복물의 실패를 일으키지 않는다.", "ok": ["참(True)", "거짓(False)"], "exp": "아말감의 성질(Properties) 다섯 가지는 강도(Strength), 치수 변화(Dimensional Change), 크리프(Creep), 변색(Tarnish), 부식(Corrosion)입니다. 이 중 **변색(Tarnish)**과 **부식(Corrosion)**을 구분하는 것이 중요합니다.\n\n**변색(Tarnish)**\n- 치면에 생기는 색 변화(discoloration)입니다.\n- 아말감과 구강액(oral fluid)의 화학 반응입니다.\n- 보기 좋지 않습니다(unaesthetic).\n- **임상적인 영향은 없습니다(no clinical effect).**\n- **수복물을 실패하게 하지 않습니다(does not cause restoration to fail).**\n\n**부식(Corrosion)**은 다릅니다. 금속이 전자를 잃는 산화(oxidation)로 시작하고, 재료가 타액 속으로 녹아 나가 거칠어지거나 패입니다(roughness/pitting). 잘 연마된 아말감은 변색과 부식을 모두 줄여 줍니다.", "why": {"1": "False를 고르면 변색이 수복 실패를 일으킨다고 보는 것인데, tarnish는 'No clinical effect, does not cause restoration to fail'입니다."}, "one": "Tarnish = 변색, 심미 문제만, 실패 원인 아님 / Corrosion = 산화, 거칠어짐·패임.", "src": "Fillings - Amalgam.pdf, p.22, 35, 37", "nota": false}, "92": {"id": 92, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "In a Class V amalgam preparation, retention grooves are placed along the axio-mesial and axio-distal line angles.", "o": ["True", "False"], "a": 1, "qk": "5급 아말감 와동에서 유지구(retention groove)는 축-근심(axio-mesial) 및 축-원심(axio-distal) 선각을 따라 형성한다.", "ok": ["참(True)", "거짓(False)"], "exp": "Class V 아말감에서는 **기계적 유지 형태(mechanical retentive features)**가 반드시 필요합니다. 그 유지 형태가 바로 유지구(retention groove)입니다.\n\n유지구의 위치는 **축-교합 선각(axio-occlusal line angle)과 축-치은 선각(axio-gingival line angle)**입니다. 즉, 축벽이 교합측벽과 만나는 모서리, 그리고 축벽이 치은측벽과 만나는 모서리에 홈을 팝니다. 근심·원심 쪽이 아니라 **위(교합)·아래(치은)** 쪽입니다.\n\n함께 기억할 수치와 기구도 있습니다. 유지구는 **1/4 round 콘트라앵글 bur**로 만들고, 깊이는 **약 1/4 mm**입니다. 형성 bur 목록에는 #2(초기 접근), pear-shaped #245(형성), #1/4 round 또는 #37(유지)이 있습니다.\n\n문제는 위치를 근심·원심 선각으로 바꿔 놓았으므로 거짓입니다.", "why": {"0": "True를 고르면 유지구를 M·D 쪽 선각에 둔다고 보는 것인데, 실제 위치는 axio-occlusal과 axio-gingival 선각이므로 틀립니다."}, "one": "Class V 아말감 유지구 = axio-occlusal + axio-gingival 선각, 1/4 round bur, 깊이 약 1/4 mm.", "src": "Cl V 2026.pdf, p.64, 66", "nota": false}, "93": {"id": 93, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "Which of the following is NOT a characteristic of modern bulk-fill composite resin?", "o": ["Placement of 4–5 mm thick layers", "Low polymerization shrinkage", "Increased filler size", "Increased filler amount"], "a": 3, "qk": "다음 중 현대 bulk-fill composite resin의 특징이 아닌 것은?", "ok": ["4–5 mm 두께 층으로 충전", "낮은 중합 수축", "필러 크기 증가", "필러 양 증가"], "exp": "**Bulk-Fill Composite Resin(현대 composite)**의 특징은 다음과 같습니다.\n\n- **4–5 mm 두께 층**으로 넣을 수 있습니다.\n- **중합 수축이 낮습니다.** 기질을 바꿔(modified matrix) 중합 수축을 약 '70%' 줄였습니다.\n- **필러 양은 줄었습니다(reduced filler amount).**\n- **필러 크기는 커졌습니다(increased filler size).**\n\n필러에 관한 두 줄이 헷갈리기 쉽습니다. '양은 줄고(reduced amount), 크기는 커짐(increased size)'입니다. 오답 보기는 이 중 '양'의 방향을 뒤집었습니다.", "why": {"0": "Bulk-fill의 특징입니다.", "1": "Bulk-fill의 특징입니다(기질을 바꿔 수축을 약 70% 줄임).", "2": "Bulk-fill의 특징입니다.", "3": "Bulk-fill은 필러 양이 '줄어든(reduced filler amount)' 것이 특징입니다. 그래서 이것이 '아닌 것'입니다."}, "one": "Bulk-fill: 4–5 mm, 수축↓(약 70%), 필러 양↓, 필러 크기↑.", "src": "Fillings - Composite, GI.pdf, p.19", "nota": false}, "94": {"id": 94, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "mc", "q": "A conventional (non-bulk-fill) light-cure composite can adequately cure about how thick a section at a time?", "o": ["3 mm", "4–5 mm", "1 mm", "None of the above"], "a": 3, "qk": "일반(bulk-fill이 아닌) 광중합 composite는 한 번에 약 몇 mm 두께까지 충분히 경화할 수 있는가?", "ok": ["3 mm", "4–5 mm", "1 mm", "위의 어느 것도 아니다"], "exp": "광중합형 composite의 중합 깊이에서 가장 중요한 숫자는 **약 2 mm**입니다. 일반 composite는 **한 번에 약 2 mm 두께만 충분히 경화**할 수 있습니다. **그래서 치아를 조금씩(incrementally) 채웁니다.**\n\n예외는 **bulk-fill composite**로, **4–5 mm** 두께까지 한 번에 넣을 수 있습니다. Bulk-fill은 기질을 바꿔 중합 수축을 약 '70%' 줄였고, 필러 양은 줄이고 필러 크기는 키운 것이 특징입니다.\n\n보기에는 2 mm가 없습니다. 4–5 mm는 bulk-fill의 숫자이므로 함정입니다. 그래서 정답은 '위의 어느 것도 아니다'입니다.", "why": {"0": "일반 composite의 경화 두께(~2 mm)가 아닙니다.", "1": "4–5 mm는 예외인 bulk-fill composite의 두께입니다. 일반 composite가 아닙니다.", "2": "일반 composite의 경화 두께(~2 mm)가 아닙니다.", "3": "정답인 '약 2 mm'가 보기에 없으므로 '위의 어느 것도 아니다'가 정답입니다."}, "one": "일반 composite ~2 mm씩(→ incremental), bulk-fill은 4–5 mm.", "src": "Fillings - Composite, GI.pdf, p.17, 19", "nota": true}, "95": {"id": 95, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "mc", "q": "According to the Academy of Operative Dentistry, all of the following are reasons to treat an NCCL EXCEPT:", "o": ["The lesion is located on a facial surface", "Threat to the strength of the tooth because of the depth of the lesion", "Food collection", "Esthetic unacceptability of the lesion"], "a": 0, "qk": "Academy of Operative Dentistry 권고에서 NCCL을 치료해야 하는 이유가 아닌 것은?", "ok": ["병소가 협측/순측(facial) 면에 있다", "병소 깊이 때문에 치아 강도가 위협받음", "음식물 정체(Food collection)", "병소의 심미적으로 받아들일 수 없는 상태"], "exp": "NCCL이 있다고 모두 바로 수복하는 것은 아닙니다. Academy of Operative Dentistry는 다음과 같은 경우에 NCCL을 치료하라고 권고합니다.\n\n1. 원인 요소를 없애도 진행을 막거나 줄일 수 없을 때(inability to eliminate or reduce the progression through elimination of etiologic factor)\n2. 병소가 심미적으로 받아들일 수 없을 때(esthetic unacceptability)\n3. 심한 과민이 있을 때(significant sensitivity)\n4. 병소 깊이 때문에 치아의 강도와 치관-치근 단위(coronal-radicular unit)의 온전함이 위협받을 때\n5. 환자의 삶의 질에 영향을 줄 때(impact on patient’s quality of life)\n6. 음식물이 정체될 때(food collection)\n\n'Facial 면에 있다'는 Class V 병소가 보통 어디에 생기는지에 대한 설명(usually on facial surfaces)이지, 치료해야 하는 이유가 아닙니다. 위치 설명과 치료 기준을 섞어 놓은 함정 보기입니다.", "why": {"0": "Facial 면은 Class V 병소가 '흔히' 생기는 위치일 뿐, 치료 이유 목록에는 없습니다. 그래서 이것이 '아닌 것'입니다.", "1": "AOD 권고의 치료 이유에 포함됩니다.", "2": "AOD 권고의 치료 이유에 포함됩니다.", "3": "AOD 권고의 치료 이유에 포함됩니다."}, "one": "AOD NCCL 치료 기준: 원인 제거로 진행 못 막음·심미·과민·강도 위협·삶의 질·음식물 정체.", "src": "Cl V 2026.pdf, p.8, 10", "nota": false}, "96": {"id": 96, "lec": "CO", "lecn": "Fillings: Composite & Glass Ionomer", "kind": "tf", "q": "Larger filler sizes improve the esthetics and polishability of composite.", "o": ["True", "False"], "a": 1, "qk": "필러 크기가 클수록 composite의 심미성과 연마성이 좋아진다.", "ok": ["참(True)", "거짓(False)"], "exp": "필러 크기에 따른 성질은 방향을 정확히 기억해야 합니다.\n\n- **작은 필러(smaller filler sizes)** → **심미성과 연마성이 좋아짐(improves esthetics and polishability)**\n- **큰 필러(larger filler sizes)** → **마모가 더 생길 수 있음(can cause more wear)**\n\n그래서 최근에는 나노 필러(nano-fillers, 0.005–0.1 μm)와 나노 하이브리드(nano-hybrid)가 나왔습니다. 클리닉에서 쓰는 Filtek Supreme(3M)도 나노 필러(nanofilled) composite입니다.\n\n문제는 '큰 필러'가 심미성과 연마성을 높인다고 했으므로 거짓입니다. 그것은 '작은 필러'의 특징입니다.", "why": {"0": "True를 고르면 큰 필러가 심미·연마성에 유리하다고 보는 것인데, 그것은 작은 필러의 장점이고 큰 필러는 마모를 더 일으킬 수 있습니다."}, "one": "작은 필러 = 심미·연마성↑, 큰 필러 = 마모↑.", "src": "Fillings - Composite, GI.pdf, p.10, 12, 28", "nota": false}, "97": {"id": 97, "lec": "CLV", "lecn": "Class V Cavity Prep & Restorations", "kind": "tf", "q": "Abfraction is cervical wear resulting from mechanical stress related to loading.", "o": ["True", "False"], "a": 0, "qk": "Abfraction(굴곡파절성 병소)은 하중(loading)과 관련된 기계적 응력(mechanical stress)으로 인한 치경부 마모이다.", "ok": ["참(True)", "거짓(False)"], "exp": "NCCL의 세 종류 중 **Abfraction**은 '하중(loading)과 관련된 기계적 응력(mechanical stress)으로 인한 치경부 마모(cervical wear)'로 정의됩니다. 즉, 씹는 힘 같은 교합 하중이 치아에 걸릴 때 치경부에 응력이 집중되면서 치질이 떨어져 나가는 것입니다.\n\n여기서 헷갈리기 쉬운 것이 **Abrasion**입니다. Abrasion도 '기계적인 힘'이지만, 그 힘은 칫솔질처럼 **바깥에서 치면을 문지르는 힘**입니다. 반면 Abfraction은 **하중에 의한 응력**입니다. 둘 다 mechanical이라는 단어가 들어가니, '칫솔 = abrasion, 하중/스트레스 = abfraction'으로 구분하세요.\n\n그리고 Erosion은 산에 의한 화학적 용해입니다. 이 세 가지가 섞여 함께 나타날 수도 있습니다.", "why": {"1": "False를 고르면 abfraction이 하중 관련 응력과 무관하다는 뜻이 되는데, abfraction의 정의 자체가 'mechanical stress related to loading'이므로 틀립니다."}, "one": "Abfraction = 하중(loading) 관련 응력 → 치경부 마모.", "src": "Cl V 2026.pdf, p.5", "nota": false}, "98": {"id": 98, "lec": "AM", "lecn": "Fillings: Amalgam", "kind": "mc", "q": "In the corrosion potential series presented (Gold < Silver < Iron < Zinc < Aluminum), which metal has the LOWEST corrosion potential?", "o": ["Zinc", "Gold", "Silver", "Aluminum"], "a": 1, "qk": "제시된 부식 경향 순서(Gold < Silver < Iron < Zinc < Aluminum)에서 부식 경향이 가장 낮은 금속은?", "ok": ["아연(Zinc)", "금(Gold)", "은(Silver)", "알루미늄(Aluminum)"], "exp": "**부식(Corrosion)**은 금속이 전자를 잃는 산화(oxidation)로 시작합니다. 그 결과 재료가 타액 속으로 녹아 나가 거칠어지거나 패이고, 음식이나 타액의 화학적 공격으로도 부식이 생길 수 있습니다.\n\n부식 경향(corrosion potential)은 **Gold < Silver < Iron < Zinc < Aluminum** 순서로 제시됩니다. 금이 가장 낮고 알루미늄이 가장 높습니다.\n\n그리고 **잘 연마된 아말감은 변색과 부식을 줄입니다(well polished amalgam limits tarnish & corrosion).** 그래서 충전 24시간 후, 과열을 피하려고 물을 쓰면서 연마합니다.", "why": {"0": "아연은 철 다음으로, 부식 경향이 높은 쪽입니다.", "1": "순서의 맨 앞(가장 작은 쪽)이 금입니다. 정답입니다.", "2": "은은 금 다음입니다.", "3": "알루미늄은 순서의 맨 끝으로, 부식 경향이 가장 높습니다."}, "one": "부식 경향: Gold < Silver < Iron < Zinc < Aluminum. 연마하면 변색·부식↓.", "src": "Fillings - Amalgam.pdf, p.37, 39", "nota": false}, "99": {"id": const LS='op_q4_';let S=null,set=null,view='sets';
function load(k){try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}}
function save(){if(set)localStorage.setItem(LS+set.key,JSON.stringify(S));localStorage.setItem(LS+'last',set?set.key:'');localStorage.setItem(LS+'view',view)}
function fresh(){return{mode:'study',ans:{},chk:{},cur:0,submitted:false,score:null,retry:null}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
const th=localStorage.getItem(LS+'theme');if(th==='dark')document.body.classList.add('dark');
function setThemeBtn(){theme.textContent=document.body.classList.contains('dark')?'Light':'Dark'}setThemeBtn();
theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(LS+'theme',document.body.classList.contains('dark')?'dark':'light');setThemeBtn()};
document.getElementById('home').onclick=home;
const savedView=localStorage.getItem(LS+'view');if(savedView==='chapters'||savedView==='sets')view=savedView;
function packs(){return view==='chapters'?D.chapters:D.sets}
function backLabel(){return view==='chapters'?'← Chapters':'← Sets'}
function home(){set=null;localStorage.setItem(LS+'last','');
 const intro=view==='chapters'
  ?'<b>100 questions · by chapter</b><div class="mu">Lecture order: Composite &amp; GI (30) → Amalgam (30) → Class V (40). Same questions as the 10 mixed sets; chapter progress is saved separately.</div>'
  :'<b>100 questions · 10 mixed sets of 10</b><div class="mu">Class V Cavity Prep &amp; Restorations (40) · Fillings: Composite &amp; Glass Ionomer (30) · Fillings: Amalgam (30)</div>';
 let h=`<div class="card">${intro}<div class="mu" style="margin-top:6px">Pick an answer (you can change it), then press <b>Check</b> to see the answer and the detailed Korean explanation. Progress is saved on this device automatically.</div>
 <div class="tabs"><button id="tabSets" ${view==='sets'?'class="pri"':''}>Mixed sets</button><button id="tabCh" ${view==='chapters'?'class="pri"':''}>By chapter</button></div></div><div class="grid">`;
 packs().forEach((s,i)=>{const st=load(s.key);let info='Not started';
  if(st){const n=Object.keys(st.ans).length;info=st.score?`Submitted: ${st.score.c}/${st.score.t}`:`In progress: ${n}/${s.ids.length} answered`}
  const range=view==='sets'?` <span class="mu">(Q${s.ids[0]}–${s.ids[s.ids.length-1]})</span>`:'';
  h+=`<div class="card"><b>${esc(s.name)}</b>${range}<div class="mu">${s.ids.length} questions · ${info}</div><div class="row" style="margin-top:10px"><button class="pri" data-o="${i}">${st?'Resume':'Start'}</button>${st?`<button data-r="${i}">Reset</button>`:''}</div></div>`});
 app.innerHTML=h+'</div>';
 tabSets.onclick=()=>{view='sets';save();home()};
 tabCh.onclick=()=>{view='chapters';save();home()};
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>open_(+b.dataset.o));
 app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const s=packs()[+b.dataset.r];if(confirm('Reset progress for '+s.name+' only?')){localStorage.removeItem(LS+s.key);home()}})}
function open_(i){set=packs()[i];S=load(set.key)||fresh();if(!S.chk)S.chk={};save();render();scrollTo(0,0)}
function ctx(){return S.retry?S.retry:S}
function ids(){return S.retry?S.retry.ids:set.ids}
function expl(q,my){const L='ABCD';let h='';
 h+=`<h4>문제 번역</h4><p>${esc(q.qk)}</p>`;
 h+=`<h4>보기 번역</h4><p>${q.ok.map((o,k)=>L[k]+'. '+esc(o)).join('<br>')}</p>`;
 h+=`<h4>정답</h4><p><b>${L[q.a]}. ${esc(q.o[q.a])}</b></p>`;
 h+=`<h4>해설</h4>${md(q.exp)}`;
 const w=Object.keys(q.why).map(Number).filter(k=>k!==q.a).sort();
 h+=`<h4>오답 해설</h4><p>${w.map(k=>'<b>'+L[k]+'. '+esc(q.o[k])+'</b> — '+esc(q.why[k])).join('<br>')}</p>`;

 const reveal=(A.mode==='study'&&A.chk[id])||A.submitted;
 let h=`<div class="row" style="justify-content:space-between"><button id="back">${backLabel()}</button><span class="mu">${esc(set.name)}${S.retry?' · Retry':''}</span></div>`;
 h+=`<div class="row" style="margin-top:10px"><span class="mu">Mode:</span><button id="ms" ${A.mode==='study'?'class="pri"':''} ${A.submitted?'disabled':''}>Study (check each)</button><button id="me" ${A.mode==='exam'?'class="pri"':''} ${A.submitted?'disabled':''}>Exam (submit at end)</button></div>`;
 h+='<div class="nav">'+L.map((x,j)=>{let c=[];if(A.ans[x]!==undefined)c.push('ans');if(j===A.cur)c.push('cur');if(A.submitted||(A.mode==='study'&&A.chk[x])){if(A.ans[x]!==undefined)c.push(A.ans[x]===D.q[x].a?'r':'w')}return `<button class="${c.join(' ')}" data-j="${j}">${j+1}</button>`}).join('')+'</div>';
 h+=`<div class="card"><div class="mu"><span class="tag">${q.kind==='tf'?'True / False':'Multiple choice'}</span>Question ${A.cur+1} of ${L.length}</div><p style="font-size:1.05rem"><b>${esc(q.q)}</b></p>`;
 q.o.forEach((o,k)=>{let c='opt';if(my===k)c+=' sel';if(reveal){if(k===q.a)c+=' ok';else if(my===k)c+=' bad'}
  h+=`<button class="${c}" data-k="${k}" ${reveal?'disabled':''}>${'ABCD'[k]}. ${esc(o)}</button>`});
 if(!reveal&&A.mode==='study')h+=`<button id="chk" class="pri" ${my===undefined?'disabled':''}>Check</button><div class="hint">${my===undefined?'Choose an answer first. ':''}You can change your choice until you press Check.</div>`;
 if(!reveal&&A.mode==='exam')h+=`<div class="hint">Exam mode: answers are shown after you submit the set.</div>`;
 if(reveal)h+=`<div class="exp"><p><b>${my===q.a?'<span class="ok">Correct</span>':my===undefined?'<span class="mu">Unanswered</span>':'<span class="bad">Incorrect</span>'}</b> — Answer: ${'ABCD'[q.a]}</p>${expl(q,my)}</div>`;
 h+=`</div><div class="row" style="justify-content:space-between"><button id="prev" ${A.cur?'':'disabled'}>← Prev</button>`;
 h+=A.submitted?'<button id="res" class="pri">Results</button>':`<button id="sub">Submit</button>`;
 h+=`<button id="next" ${A.cur<L.length-1?'':'disabled'}>Next →</button></div>`;
 app.innerHTML=h;
 back.onclick=home;prev.onclick=()=>{A.cur--;save();render()};next.onclick=()=>{A.cur++;save();render();scrollTo(0,0)};
 app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{A.cur=+b.dataset.j;save();render()});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{A.ans[id]=+b.dataset.k;save();render()});
 if(window.chk&&chk.tagName==='BUTTON')chk.onclick=()=>{if(A.ans[id]===undefined)return;A.chk[id]=true;save();render()};
 ms.onclick=()=>{A.mode='study';save();render()};me.onclick=()=>{A.mode='exam';save();render()};
 if(window.sub)sub.onclick=()=>{const un=L.filter(x=>A.ans[x]===undefined).length;if(un&&!confirm(un+' unanswered. Submit anyway?'))return;A.submitted=true;
  const c=L.filter(x=>A.ans[x]===D.q[x].a).length;A.result={c,t:L.length};if(!S.retry){S.score={c,t:L.length}}save();results()};
 if(window.res)res.onclick=results}
function results(){const A=ctx(),L=ids();const r=L.filter(x=>A.ans[x]===D.q[x].a),w=L.filter(x=>A.ans[x]!==undefined&&A.ans[x]!==D.q[x].a),u=L.filter(x=>A.ans[x]===undefined);
 const list=a=>a.map(x=>`<li>Q${L.indexOf(x)+1}: ${esc(D.q[x].q)}</li>`).join('');
 let h=`<button id="back">${backLabel()}</button><div class="card"><h2>${S.retry?'Retry results':'Results'} — ${esc(set.name)}</h2><p><b>${r.length}/${L.length}</b> correct (${Math.round(100*r.length/L.length)}%)</p>
 ${S.retry&&S.score?`<p class="mu">Original score kept: ${S.score.c}/${S.score.t}</p>`:''}
 <p class="bad"><b>Wrong: ${w.length}</b></p><ol>${list(w)}</ol><p class="mu"><b>Unanswered: ${u.length}</b></p><ol>${list(u)}</ol>
 <div class="row"><button id="rev">Review answers</button>${w.length+u.length?'<button id="rt" class="pri">Retry wrong &amp; unanswered</button>':''}${S.retry?'<button id="ex">End retry</button>':''}</div></div>`;
 app.innerHTML=h;back.onclick=home;rev.onclick=()=>{A.cur=0;save();render()};
 if(window.rt)rt.onclick=()=>{S.retry={ids:w.concat(u),mode:'study',ans:{},chk:{},cur:0,submitted:false};save();render()};
 if(window.ex)ex.onclick=()=>{S.retry=null;save();results()}}
const last=localStorage.getItem(LS+'last');
const all=[...D.sets,...(D.chapters||[])];
const li=all.findIndex(s=>s.key===last);
if(li>=0){const pack=all[li];view=D.chapters&&D.chapters.some(c=>c.key===pack.key)?'chapters':'sets';set=pack;S=load(set.key)||fresh();if(!S.chk)S.chk={};save();render()}
else home();
